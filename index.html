<link rel="dns-prefetch" href="https://server.arcgisonline.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #04050a;
    --void-2: #0a0d16;
    --panel: rgba(10, 13, 22, 0.72);
    --line: rgba(212, 175, 106, 0.18);
    --gold: #d4af6a;
    --gold-dim: #7a6a45;
    --text: #e9e7e0;
    --text-dim: #8b8a97;
    --sans: 'Space Grotesk', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: var(--sans);
    color: var(--text);
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark { width: 40px; height: 40px; flex-shrink: 0; display: block; }
  .brand-text { min-width: 0; }
  .loading .loading-logo { width: min(240px, 62vw); height: auto; opacity: 0; animation: logoIn 0.9s ease 0.1s forwards; }
  @keyframes logoIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .loading .loading-logo { animation: none; opacity: 1; } }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .veil {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(4,5,10,0.55) 100%);
    pointer-events: none;
    z-index: 5;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 18px 18px 0;
    z-index: 20;
    pointer-events: none;
  }
  .brand { pointer-events: auto; }
  .brand h1 {
    font-size: 19px; font-weight: 600; letter-spacing: 0.3px;
    color: var(--text);
  }
  .brand p {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .layer-toggles {
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: auto;
  }
  .chip, .chip2 {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 11px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 20px;
    font-size: 11.5px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .chip:focus-visible, .chip2:focus-visible, .compass:focus-visible, .ml-btn:focus-visible, .mode-switch button:focus-visible, #search-input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .chip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.15s, box-shadow 0.15s;
  }
  .chip.active { color: var(--text); border-color: var(--gold-dim); }
  .chip.active .dot { background: var(--gold); box-shadow: 0 0 5px var(--gold); }
  .chip[data-toggle=clouds].active .dot{background:#dbeafe;box-shadow:0 0 5px #dbeafe}
  .chip[data-toggle=borders].active .dot{background:#f0a800;box-shadow:0 0 5px #f0a800}
  .chip[data-toggle=night].active .dot{background:#8b7cff;box-shadow:0 0 5px #8b7cff}
  .chip[data-toggle=spin].active .dot{background:#7fe3ff;box-shadow:0 0 5px #7fe3ff}
  .chip[data-toggle=quakes].active .dot{background:#ff9500;box-shadow:0 0 5px #ff9500}

  .chip2 { color: var(--gold); }
  .qr { font-family: var(--mono); font-size: 10.5px; color: var(--gold); margin-left: 3px; padding: 2px 8px; border: 1px solid var(--gold-dim); border-radius: 10px; }
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 0 18px calc(18px + env(safe-area-inset-bottom, 12px));
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px;
    z-index: 20;
    pointer-events: none;
  }
  .search-wrap { flex: 1; max-width: 320px; pointer-events: auto; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);

    padding: 11px 16px;

  .search-box svg { flex-shrink: 0; opacity: 0.6; }
  .search-box input {
    flex: 1; background: none; border: none; outline: none;

  }
  .search-box input::placeholder { color: var(--text-dim); }
  .search-status {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    margin-top: 6px; padding-left: 4px; min-height: 14px;
  }
  .search-status.err { color: #c97a6a; }

  .readout {
    pointer-events: auto;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 13px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    line-height: 1.6;
    flex-shrink: 0;
  }
  .readout .label { color: var(--gold-dim); margin-right: 4px; }
  .readout .val { color: var(--text); }

  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    background: var(--void);
    z-index: 100;
    transition: opacity 0.6s ease;
  }
  .loading.hide { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.6s ease, visibility 0s linear 0.6s; }
  .loading .ring {
    width: 34px; height: 34px;
    border: 2px solid var(--line);

  .loading p { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

  .compass {
    position: fixed;
    right: 18px;
    bottom: calc(96px + env(safe-area-inset-bottom, 12px));
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--panel);
    backdrop-filter: blur(10px);

    cursor: pointer;
    user-select: none;
  }
  .compass svg { width: 100%; height: 100%; }
  .compass .needle { transform-origin: 27px 27px; transition: transform 0.05s linear; }

  .mode-switch {
    position: fixed;
    left: 18px;
    top: 72px;
    z-index: 21;
    display: flex;
    gap: 2px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 3px;
    pointer-events: auto;
  }
  .mode-switch button {
    appearance: none; border: none; background: none;
    font-family: var(--sans); font-size: 12px; color: var(--text-dim);
    padding: 6px 13px; border-radius: 14px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode-switch button.active { background: rgba(212, 175, 106, 0.16); color: var(--gold); }

  #map-wrap {
    position: fixed; inset: 0;
    background: var(--void);
    z-index: 1;
    display: none;
  }
  #map-wrap.active { display: block; }
  #map-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #map-canvas:active { cursor: grabbing; }

  .god-hud {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 25; display: none;
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 16px; font-family: var(--mono); font-size: 10.5px;
    color: var(--text-dim); line-height: 1.7; text-align: center;
    pointer-events: none; max-width: calc(100vw - 36px);
  }
  .god-hud .title { color: var(--gold); letter-spacing: 2px; font-size: 10px; margin-bottom: 2px; }
  .god-hud .val { color: var(--text); }
  body.god .god-hud { display: none; } /* info bar removed */
  body.god .layer-toggles, body.god .bottom-bar, body.god .compass { opacity: 0; pointer-events: none; }
  .layer-toggles, .bottom-bar, .compass { transition: opacity 0.4s; }

  .god-panel{position:fixed;right:18px;top:18px;z-index:26;display:none;flex-direction:column;gap:5px;width:190px}
  body.god .god-panel{display:flex}
  .gp-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;font-size:11px;color:var(--text-dim);cursor:pointer;user-select:none;opacity:.55;transition:opacity .15s,border-color .15s}
  .gp-row.on{opacity:1;border-color:var(--gold-dim);color:var(--text)}
  .gp-tag{font-family:var(--mono);font-size:9px;color:var(--gold);min-width:34px}
  .gp-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gp-n{font-family:var(--mono);font-size:10px;color:var(--text)}
  .gp-exp{display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;margin:-3px -4px -3px 2px;border-left:1px solid var(--line);color:var(--gold);font-size:13px;transition:transform .2s}
  .gp-exp.open{transform:rotate(180deg)}
  .gp-subs{display:flex;flex-wrap:wrap;gap:4px;padding:1px 2px 3px}
  .gp-sub{display:flex;align-items:center;gap:4px;padding:3px 7px;background:var(--panel);border:1px solid var(--line);border-radius:9px;font-size:9.5px;color:var(--text-dim);cursor:pointer;opacity:.5}
  .gp-sub.on{opacity:1;color:var(--text)}
  .gp-sub i{width:7px;height:7px;border-radius:50%}
  .gp-sub b{font-family:var(--mono);font-weight:400;color:var(--gold)}
  .god-card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:27;display:none;min-width:230px;max-width:calc(100vw - 36px);background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--gold-dim);border-radius:12px;padding:11px 14px;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);line-height:1.7;cursor:pointer;max-height:44vh;overflow:auto;touch-action:pan-y}
  .god-card.show{display:block;max-height:calc(100vh - 300px);overflow-y:auto}

  .god-card.fr{min-width:0;width:min(380px,calc(100vw - 24px));background:rgba(17,20,28,.96);border:1px solid rgba(255,198,26,.35)!important;border-radius:16px;padding:0;color:#e9edf5;font-family:var(--sans);line-height:1.3;overflow:hidden}
  .god-card.fr .fr-in{padding:12px 14px 12px;position:relative}
  .god-card.fr .fr-x{position:absolute;top:4px;right:4px;float:none;width:34px;height:34px;margin:0;background:none;border:0;color:#7d8596;font-size:15px;cursor:pointer;padding:0;z-index:2}
  .fr-head{display:flex;gap:10px;align-items:flex-start;padding-right:20px}
  .fr-id{flex:1;min-width:0}
  .fr-call{font-size:22px;font-weight:700;letter-spacing:.5px;color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fr-badge{font-size:9.5px;font-weight:600;letter-spacing:1px;background:#ffc61a;color:#14171f;border-radius:5px;padding:2px 6px}
  .fr-badge.mil{background:#ff3b3b;color:#fff}
  .fr-badge.em{background:#ff3b3b;color:#fff;animation:blink 1s infinite}
  .fr-air{font-size:12.5px;color:#aab2c3;margin-top:2px}
  .fr-photo{width:112px;height:66px;border-radius:9px;object-fit:cover;background:#0b0d12;flex:none;border:1px solid #262b38}
  .fr-route{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
  .fr-end{min-width:54px}
  .fr-end.r{text-align:right}
  .fr-code{font-size:26px;font-weight:700;color:#fff;letter-spacing:.5px}
  .fr-city{font-size:10.5px;color:#8f98aa;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fr-end.r .fr-city{margin-left:auto}
  .fr-bar{flex:1;position:relative;height:22px}
  .fr-bar:before{content:"";position:absolute;left:0;right:0;top:10px;height:0;border-top:2px dotted #3a4254}
  .fr-bar i{position:absolute;left:0;top:10px;height:2px;background:#ffc61a;border-radius:2px;display:block}
  .fr-bar svg{position:absolute;top:1px;width:20px;height:20px;margin-left:-10px;fill:#ffc61a;transform:rotate(90deg);filter:drop-shadow(0 0 3px rgba(0,0,0,.8))}
  .fr-sub{display:flex;justify-content:space-between;font-size:10.5px;color:#8f98aa;margin-bottom:10px}
  .fr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#262b38;border-radius:10px;overflow:hidden}
  .fr-grid div{background:#1a1e29;padding:7px 9px}
  .fr-grid b{display:block;font-size:9px;letter-spacing:1px;font-weight:500;color:#7d8596;margin-bottom:2px}
  .fr-grid em{font-style:normal;font-size:14px;font-weight:600;color:#fff}
  .fr-grid small{font-size:10px;font-weight:400;color:#8f98aa;margin-left:2px}
  .fr-ac{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:#aab2c3;margin-top:10px}
  .fr-ac span{display:inline;min-width:0;color:#fff}
  .fr-foot{font-family:var(--mono);font-size:9.5px;color:#6a7284;margin-top:8px}
  .god-card .gc-tag{color:var(--gold);letter-spacing:1.5px;font-size:9.5px}
  .god-card .gc-title{font-family:var(--sans);font-size:14px;color:var(--text);margin:2px 0 4px}
  .god-card span{color:var(--gold-dim);display:inline-block;min-width:88px}
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5fe08a;box-shadow:0 0 6px #5fe08a;margin-right:6px;animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  .gp-sw{width:10px;height:10px;border-radius:50%;flex:none}
  .gp-ic{width:20px;height:20px;border-radius:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-style:normal;line-height:1}
  @media (max-width: 420px){.god-panel{width:152px;top:14px}.gp-tag{display:none}.brand{max-width:calc(100vw - 190px)}.god-card{bottom:calc(220px + env(safe-area-inset-bottom,0px))}}
  .ml-btn{display:none;position:fixed;left:18px;top:116px;z-index:22;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--gold-dim);border-radius:18px;padding:7px 14px;font-size:12px;color:var(--gold);cursor:pointer;user-select:none}
  body.mapmode .ml-btn{display:flex;align-items:center;gap:7px;min-height:40px}
  .ml-ic{font-size:15px;line-height:1}
  .ml-cur{font-family:var(--mono);font-size:10px;color:var(--text-dim);max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ml-btn.attn{animation:mlpulse 1.6s ease-out 3}
  @keyframes mlpulse{0%{box-shadow:0 0 0 0 rgba(212,175,106,.7)}100%{box-shadow:0 0 0 14px rgba(212,175,106,0)}}
  @media (prefers-reduced-motion: reduce){.ml-btn.attn{animation:none;border-color:var(--gold)}}
  .ms-row{min-height:40px;display:flex;align-items:center}
  .ml-sheet{top:164px}
  .ms-hint{font-size:10.5px;color:var(--text-dim);margin:2px 2px 4px;line-height:1.35}
  .ml-sheet{display:none;position:fixed;left:18px;top:156px;z-index:23;width:min(214px,calc(100vw - 150px));max-height:calc(100vh - 300px);overflow-y:auto;touch-action:pan-y;flex-direction:column;gap:5px;padding:8px;background:rgba(10,13,22,.9);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px}
  body.mapmode .ml-sheet.open{display:flex}
  .ms-h{font-family:var(--mono);font-size:9.5px;color:var(--gold-dim);letter-spacing:1.5px;margin:4px 2px 0}
  .ms-row{flex:none}
  @media (max-width: 420px) {
    .brand h1 { font-size: 16px; }
    .bottom-bar { flex-direction: column; align-items: stretch; gap: 8px; }
    .search-wrap { max-width: none; }
    .readout { align-self: flex-start; }
    .mode-switch { top: 68px; }
    .mode-switch button { padding: 6px 11px; font-size: 11.5px; }
  }

  /* ---- Touch targets, focus and motion ---- */
  .chip, .chip2 { min-height: 40px; }
  .chip-wrap { position: relative; display: flex; }
  .chip-wrap .chip { flex: 1; padding-right: 68px; }
  .qr {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    appearance: none; -webkit-appearance: none; background: none; cursor: pointer; margin: 0;
    font-family: var(--mono); font-size: 11px; color: var(--gold);
    border: 1px solid var(--gold-dim); border-radius: 12px; padding: 3px 10px; min-height: 28px;
  }
  .qr::after { content: ''; position: absolute; inset: -9px -6px; }
  .mode-switch button { min-height: 38px; }
  .ml-btn { top: 124px; }
  body.mapmode .ml-btn { min-height: 44px; }
  .ml-sheet { top: 176px; }
  .ms-row { min-height: 44px; }
  .gp-row { min-height: 40px; opacity: .72; }
  .gp-sub { min-height: 34px; padding: 6px 10px; font-size: 11px; opacity: .72; }
  .gp-tag { font-size: 10px; }
  .god-panel { max-height: calc(100vh - 36px); max-height: calc(100dvh - 36px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: none; }
  .god-panel::-webkit-scrollbar { display: none; }
  .gp-wrap { position: relative; display: flex; flex-direction: column; }
  .gp-row.has-exp { padding-right: 50px; }
  .gp-exp { position: absolute; right: 0; top: 0; bottom: 0; width: 44px; height: auto; margin: 0; border-left: 1px solid var(--line); border-radius: 0 10px 10px 0; font-size: 15px; cursor: pointer; }
  .gp-exp.open { transform: none; }
  .gc-close {
    float: right; display: flex; align-items: center; justify-content: center;
    appearance: none; -webkit-appearance: none; background: none; border: 0; cursor: pointer;
    width: 44px; height: 44px; margin: -12px -14px 4px 8px; font-size: 18px; color: var(--text-dim);
  }
  .chip:focus-visible, .chip2:focus-visible, .qr:focus-visible, .gp-row:focus-visible, .gp-sub:focus-visible,
  .gp-exp:focus-visible, .gc-close:focus-visible, #canvas-wrap:focus-visible, #map-canvas:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }
  .gp-row:focus-visible, .gp-sub:focus-visible, .gp-exp:focus-visible, #canvas-wrap:focus-visible, #map-canvas:focus-visible { outline-offset: -3px; }
  @media (pointer: coarse) {
    .search-box { padding: 9px 16px; }
    .search-box input { font-size: 16px; } /* 16px stops iOS zooming the page when the field is focused */
  }
  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
    .loading .ring { animation-duration: 2.8s; }
    .loading.hide { transition: none; }
    .chip, .chip2, .gp-row, .gp-exp, .mode-switch button, .layer-toggles, .bottom-bar, .compass, .compass .needle { transition: none; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  const wrap = document.getElementById('canvas-wrap');
  const loading = document.getElementById('loading');
  let currentMode = 'globe'; // 'globe' (home) or 'map' (2D)

  // ---- Scene setup ----
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
  camera.position.set(0, 0.6, 3.4);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  wrap.appendChild(renderer.domElement);

  // ---- Starfield (procedural, no external texture needed) ----
  function buildStars(){
    const geo = new THREE.BufferGeometry();
    const count = 2600;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 40 + Math.random() * 60;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i*3+2] = r * Math.cos(phi);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, sizeAttenuation: true, transparent: true, opacity: 0.75 });
    return new THREE.Points(geo, mat);
  }
  scene.add(buildStars());

  // ---- Lighting: sun position matches the real subsolar point right now ----
  // Both the light and its target are children of globeGroup, so they stay locked
  // to the correct latitude/longitude on the texture even as the globe is
  // rotated by dragging, auto-rotate, or the compass reset.
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  const sunTarget = new THREE.Object3D();
  sunTarget.position.set(0, 0, 0);
  const ambientLight = new THREE.AmbientLight(0x30364a, 0.4);
  scene.add(ambientLight);

  function getSubsolarPoint(date){
    const utcHours = date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600;
    let lon = -15 * (utcHours - 12);
    lon = ((lon + 180) % 360 + 360) % 360 - 180;
    const start = Date.UTC(date.getUTCFullYear(), 0, 0);
    const dayOfYear = (date.getTime() - start) / 86400000;
    const decl = -23.44 * Math.cos((2 * Math.PI / 365.24) * (dayOfYear + 10));
    return { lat: decl, lon };
  }

  // ---- Earth ----
  const EARTH_R = 1;
  const globeGroup = new THREE.Group();
  scene.add(globeGroup);
  globeGroup.add(sun);
  globeGroup.add(sunTarget);
  sun.target = sunTarget;

  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';

  const TEX_SOURCES = {
    day: [
      'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=BlueMarble_NextGeneration&STYLES=&SRS=EPSG:4326&BBOX=-180,-90,180,90&WIDTH=4096&HEIGHT=2048&FORMAT=image/jpeg',
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_atmos_2048.jpg',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_atmos_2048.jpg',
      'https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/textures/planets/earth_atmos_2048.jpg'
    ],
    specular: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_specular_2048.jpg',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_specular_2048.jpg'
    ],
    normal: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_normal_2048.jpg',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_normal_2048.jpg'
    ],
    night: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_lights_2048.png',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_lights_2048.png'
    ],
    clouds: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_clouds_1024.png',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_clouds_1024.png'
    ]
  };

  // Simple hand-drawn fallback map, used only if every online source fails,
  // so the globe always shows a recognizable land/ocean map, never a blank sphere.
  function makeFallbackEarthCanvas(){
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#0d3b66');
    grad.addColorStop(1, '#08243f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);
    ctx.fillStyle = '#3d7a54';
    function blob(x, y, w, h){ ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2); ctx.fill(); }
    blob(170, 190, 95, 75); blob(230, 280, 60, 95); blob(120, 340, 50, 40);
    blob(520, 150, 115, 60); blob(560, 260, 75, 55); blob(600, 340, 55, 45);
    blob(760, 175, 85, 60); blob(820, 320, 100, 70); blob(880, 400, 60, 40);
    blob(950, 140, 70, 50); blob(40, 130, 55, 35);
    return c;
  }

  function loadTextureChain(urls, onLoad, onFail, into){
    const texture = into || new THREE.Texture();
    const imgLoader = new THREE.ImageLoader();
    imgLoader.crossOrigin = 'anonymous';
    let i = 0;
    function tryNext(){
      if (i >= urls.length) { onFail && onFail(texture); return; }
      const url = urls[i++];
      imgLoader.load(url, (image) => {
        texture.image = image;
        texture.needsUpdate = true;
        onLoad && onLoad(texture);
      }, undefined, tryNext);
    }
    tryNext();
    return texture;
  }

  let dayLoaded = false;
  let usedFallbackMap = false;
  const dayTex = loadTextureChain(TEX_SOURCES.day, () => { dayLoaded = true; startExtras(); if (currentMode === 'map') drawMap(); }, (tex) => {
    tex.image = makeFallbackEarthCanvas();
    tex.needsUpdate = true;
    dayLoaded = true;
    usedFallbackMap = true;
    startExtras();
    if (currentMode === 'map') drawMap();
  });
  // The day map gets the whole connection first; the finishing textures follow once it is in (or after 3 s),
  // and the city-lights picture is only fetched the first time night shading is switched on.
  const specTex = new THREE.Texture(), normalTex = new THREE.Texture(), nightTex = new THREE.Texture(), cloudTex = new THREE.Texture();
  let extrasStarted = false, nightStarted = false;
  function startExtras(){
    if (extrasStarted) return; extrasStarted = true;
    loadTextureChain(TEX_SOURCES.specular, null, null, specTex);
    loadTextureChain(TEX_SOURCES.normal, null, null, normalTex);
    loadTextureChain(TEX_SOURCES.clouds, () => { if (currentMode === 'map') drawMap(); }, () => {

  function latLonToVec3(lat, lon, radius){
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lon + 180) * (Math.PI / 180);
    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }
  function vec3ToLatLon(v){
    const radius = v.length();
    const lat = 90 - (Math.acos(v.y / radius) * 180 / Math.PI);
    let lon = Math.atan2(v.z, -v.x) * 180 / Math.PI - 180; // inverse of latLonToVec3
    if (lon < -180) lon += 360;
    return { lat, lon };
  }

  function satScreenPick(cx, cy){

    globeGroup.updateMatrixWorld();

      const arr = sat.grp.pos, o = sat.slot * 3; v.set(arr[o], arr[o + 1], arr[o + 2]);

  async function geocode(query){

      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const results = await res.json();
      if (!results.length) {
        searchStatus.textContent = 'no place found — try a different spelling';
        searchStatus.classList.add('err');
        return;
      }
      const { lat, lon, display_name } = results[0];
      const latNum = parseFloat(lat), lonNum = parseFloat(lon);
      const latDir = latNum >= 0 ? 'N' : 'S';
      const lonDir = lonNum >= 0 ? 'E' : 'W';
      const coordStr = `${Math.abs(latNum).toFixed(decs())}°${latDir}, ${Math.abs(lonNum).toFixed(decs())}°${lonDir}`;
      searchStatus.textContent = display_name.split(',').slice(0,2).join(',') + ' · ' + coordStr;
      goToPlace(parseFloat(lat), parseFloat(lon));

      searchStatus.textContent = 'search unavailable right now — try again shortly';

      } else if (key === 'quakes') {
        quakesOn = active;
        quakeGroup.visible = active;
        if (active) loadQuakes();
        if (currentMode === 'map') drawMap();
      } else if (key === 'borders') {
        bordersOn = active;
        if (borderLines) borderLines.visible = active;
      } else if (key === 'spin') {
        autoRotate = active;
        if (!flying) controls.autoRotate = active;
      }
    });
  });

  // ---- God's Eye layer: live earthquakes (USGS, last 24h, M2.5+) ----
  const QUAKE_FEEDS = { day: ['2.5_day', '24h', 'M2.5+'], week: ['4.5_week', '7 days', 'M4.5+'], month: ['4.5_month', '30 days', 'M4.5+'] };
  const HASH = new URLSearchParams(location.hash.slice(1));
  let quakeRange = QUAKE_FEEDS[HASH.get('q')] ? HASH.get('q') : 'day';
  let quakeReq = 0;
  const quakeUrl = () => 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/' + QUAKE_FEEDS[quakeRange][0] + '.geojson';
  const quakeGroup = new THREE.Group();
  globeGroup.add(quakeGroup);
  const quakeGeo = new THREE.SphereGeometry(1, 10, 10);
  let quakes = [];
  let quakesOn = true;
  let quakeTimer = null;

  // shallow = gold, medium = orange, deep = red
  function quakeCss(depth){ return depth < 70 ? '#ffe14d' : depth < 300 ? '#ff9500' : '#ff6b6b'; }
  function quakeHex(depth){ return depth < 70 ? 0xffe14d : depth < 300 ? 0xff9500 : 0xff6b6b; }

  function timeAgo(ms){
    const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' d ago';
  }

  function buildQuakeMeshes(){
    while (quakeGroup.children.length){
      const m = quakeGroup.children[0];
      quakeGroup.remove(m);
      m.material.dispose();
    }
    for (const q of quakes){
      const mat = new THREE.SpriteMaterial({ map: shapeTex('quake'), color: quakeHex(q.depth), transparent: true, opacity: 0.95, depthWrite: false, alphaTest: 0.35 });
      const mesh = new THREE.Sprite(mat);
      const r = 0.012 + q.mag * 0.0075; // icon size grows with magnitude
      mesh.scale.setScalar(r);
      mesh.position.copy(latLonToVec3(q.lat, q.lon, EARTH_R * 1.006));
      mesh.userData = { base: r, recent: (Date.now() - q.time) < 3600000, phase: Math.random() * 6.28 };
      quakeGroup.add(mesh);
    }
    quakeGroup.visible = quakesOn;
  }

  async function loadQuakes(){
    try {
      const my = ++quakeReq;
      const res = await fetch(quakeUrl());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (my !== quakeReq) return; // a newer range was requested meanwhile
      quakes = data.features
        .filter(f => f.properties.mag != null && f.geometry)
        .map(f => ({
          lon: f.geometry.coordinates[0],
          lat: f.geometry.coordinates[1],
          depth: f.geometry.coordinates[2] || 0,
          mag: f.properties.mag,
          place: f.properties.place || 'Unknown location',
          time: f.properties.time
        }));
      buildQuakeMeshes();
      searchStatus.className = 'search-status';
      searchStatus.textContent = quakes.length + ' earthquakes (' + QUAKE_FEEDS[quakeRange][2] + ') in the last ' + QUAKE_FEEDS[quakeRange][1] + ' · tap one for details';
      if (currentMode === 'map') drawMap();
    } catch (e) {
      searchStatus.className = 'search-status err';
      searchStatus.textContent = 'earthquake data unavailable right now';
    }
  }

  function showQuakeAt(lat, lon, maxDeg){
    if (!quakesOn || !quakes.length) return;
    let best = null, bestD = maxDeg;
    for (const q of quakes){
      let dLon = Math.abs(q.lon - lon); if (dLon > 180) dLon = 360 - dLon;
      const d = Math.hypot(q.lat - lat, dLon * Math.cos(lat * Math.PI / 180));
      if (d < bestD){ best = q; bestD = d; }
    }
    if (best){
      searchStatus.className = 'search-status';
      searchStatus.textContent = 'M' + best.mag.toFixed(1) + ' · ' + best.place + ' · ' + Math.round(best.depth) + ' km deep · ' + timeAgo(best.time);
    }
  }

  function pulseQuakes(t){
    if (!quakesOn) return;
    const f = Math.max(0.002, Math.min(1, (camera.position.length() - 1) / 2.4));
    for (const m of quakeGroup.children){
      m.scale.setScalar(m.userData.base * f * (m.userData.recent ? 1 + 0.3 * Math.sin(t * 0.004 + m.userData.phase) : 1));
    }
  }

  loadQuakes();
  quakeTimer = setInterval(() => { if (quakesOn && !document.hidden) loadQuakes(); }, 5 * 60 * 1000);

  // ---- Quake time range: 24h / 7 days / 30 days ----
  const qrangeBtn = document.getElementById('qrange');
  function syncQrange(){ qrangeBtn.textContent = ({ day: '24h', week: '7d', month: '30d' })[quakeRange]; qrangeBtn.setAttribute('aria-label', 'Earthquake time range: last ' + ({ day: '24 hours', week: '7 days', month: '30 days' })[quakeRange] + '. Activate to change.'); }
  syncQrange();
  qrangeBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // don't toggle the Earthquakes chip itself
    const order = ['day', 'week', 'month'];
    quakeRange = order[(order.indexOf(quakeRange) + 1) % order.length];
    syncQrange();
    if (!quakesOn) document.querySelector('.chip[data-toggle="quakes"]').click(); else loadQuakes();
    scheduleHash();
  });

  // ---- Shareable links: the view lives in the URL hash ----
  let hashTimer = 0;
  function scheduleHash(){ clearTimeout(hashTimer); hashTimer = setTimeout(writeHash, 400); }
  function writeHash(){
    try {
      const p = new URLSearchParams();
      if (currentMode !== 'globe') p.set('m', currentMode);
      if (currentMode === 'map'){ p.set('lat', mapCenterLat.toFixed(3)); p.set('lon', mapCenterLon.toFixed(3)); p.set('z', mapZoom.toFixed(2)); }
      if (baseId !== 'sat') p.set('b', baseId);
      const ov = Object.keys(ovOn).filter(k => ovOn[k]).sort().join(',');
      if (ov !== 'labels') p.set('o', ov);
      if (quakeRange !== 'day') p.set('q', quakeRange);
      const str = p.toString();
      history.replaceState(null, '', location.pathname + location.search + (str ? '#' + str : ''));
    } catch (e) {}
  }
  document.getElementById('share-btn').addEventListener('click', async () => {
    writeHash();
    const url = location.href;
    try {
      if (navigator.share) await navigator.share({ title: 'Terlask', url });
      else { await navigator.clipboard.writeText(url); searchStatus.className = 'search-status'; searchStatus.textContent = 'link copied'; }
    } catch (e) {}
  });

  // ---- Resize ----
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    resizeMapCanvas();
    if (currentMode === 'map') drawMap();
  });

  // ---- Compass ----
  const compassNeedle = document.getElementById('compass-needle');
  const compassEl = document.getElementById('compass');
  const _tmpNorth = new THREE.Vector3();
  const _tmpOrigin = new THREE.Vector3();

  function updateCompass(){
    _tmpOrigin.set(0, 0, 0).applyMatrix4(globeGroup.matrixWorld).project(camera);
    _tmpNorth.set(0, EARTH_R * 1.4, 0).applyMatrix4(globeGroup.matrixWorld).project(camera);
    const dx = _tmpNorth.x - _tmpOrigin.x;
    const dy = _tmpNorth.y - _tmpOrigin.y; // NDC y is up already
    const angleDeg = Math.atan2(dx, dy) * (180 / Math.PI);
    compassNeedle.style.transform = `rotate(${angleDeg}deg)`;
  }

  function resetNorth(){
    const startQuat = globeGroup.quaternion.clone();
    const endQuat = new THREE.Quaternion();
    const startTime = performance.now();
    const duration = 700;
    controls.autoRotate = false;
    function step(now){
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      globeGroup.quaternion.slerpQuaternions(startQuat, endQuat, eased);
      if (t < 1) requestAnimationFrame(step);
      else controls.autoRotate = autoRotate;
    }
    requestAnimationFrame(step);
  }
  compassEl.addEventListener('click', resetNorth);

  // ---- Day / Night mode: whole-globe toggle, not a partial terminator ----
  let nightMode = false;
  function applyDayNightMode(){
    if (nightMode) {
      ensureNight();
      sun.intensity = 0;
      ambientLight.intensity = 0.12;
      ambientLight.color.set(0x1a2440);
      nightMat.opacity = 1;
    } else {
      sun.intensity = 1.05;
      ambientLight.intensity = 0.8;
      ambientLight.color.set(0xffffff);
      nightMat.opacity = 0;
    }
  }
  applyDayNightMode();

  // ---- Render loop ----
  function updateSun(){
    const { lat, lon } = getSubsolarPoint(new Date());
    sun.position.copy(latLonToVec3(lat, lon, 6));
  }


  // Close-up detail: when you zoom in on the globe or God's Eye, a sharp satellite/street patch of real map tiles is wrapped onto the ground under the view.
  const PCV = document.createElement('canvas'); PCV.width = PCV.height = 1024; const PCTX = PCV.getContext('2d');
  const patchTex = new THREE.CanvasTexture(PCV); patchTex.anisotropy = 4;
  const PN = 20, patchGeo = new THREE.BufferGeometry();
  patchGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((PN + 1) * (PN + 1) * 3), 3));
  { const uv = new Float32Array((PN + 1) * (PN + 1) * 2), idx = [];
    for (let j = 0; j <= PN; j++) for (let i = 0; i <= PN; i++){ const k = (j * (PN + 1) + i) * 2; uv[k] = i / PN; uv[k + 1] = 1 - j / PN; }
    for (let j = 0; j < PN; j++) for (let i = 0; i < PN; i++){ const a = j * (PN + 1) + i, b = a + 1, c = a + PN + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
    patchGeo.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); patchGeo.setIndex(idx); }
  const patchMesh = new THREE.Mesh(patchGeo, new THREE.MeshBasicMaterial({ map: patchTex, transparent: true, opacity: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  patchMesh.frustumCulled = false; patchMesh.visible = false; patchMesh.renderOrder = -5; // drawn before the markers, which don't write depth, so it can never paint over them globeGroup.add(patchMesh);
  let patchWin = null, patchZ = -1, patchLast = 0, patchBase = true, patchReady = 0;
  const pCache = new Map(); // own tile cache with CORS on: pictures from a no-CORS load would taint the canvas and WebGL would refuse the texture (black screen)
  function ptile(url, load, pri){
    let t = pCache.get(url);
    if (t){ pCache.delete(url); pCache.set(url, t); }
    else {
      if (!load) return null;
      t = tileEntry(true); t.url = url; t.onok = () => { patchDirty = true; };
      pCache.set(url, t); tileTrim(pCache, TILE_CAP);
    }
    if (load && !t.ok && t.state === 'idle') tileWant(t, pri);
    return t;
  }
  const mercY = lat => { const r = Math.max(-85.0511, Math.min(85.0511, lat)) * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2; };
  const mercLat = y => Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) * 180 / Math.PI;
  function updatePatch(){
    const h = camera.position.length() - 1, want = currentMode !== 'map' && h < 0.9, baseOn = h < 0.35;
    const op = patchMesh.material.opacity, tgt = want && patchReady >= 0.6 ? 1 : 0; // only show the patch once most of its tiles have arrived, so it can never be a blank dark sheet
    if (op !== tgt){ patchMesh.material.opacity = Math.abs(tgt - op) < 0.06 ? tgt : op + Math.sign(tgt - op) * 0.06; }
    patchMesh.visible = patchMesh.material.opacity > 0;
    if (!want) return;
    const now = performance.now(); if (now - patchLast < 120) return;
    const c = viewCenter(); if (!c) return;
    const aspect = window.innerWidth / window.innerHeight, hw = Math.min(0.25, Math.max(0.00004, h * 0.414 * Math.max(1, aspect) * 1.6 / 6.283)); // half-width of the patch, in world-fractions
    const mx = (c.lon + 180) / 360, my = mercY(c.lat);
    const z = Math.max(0, Math.min(19, Math.round(Math.log2(2 / hw) + 0.3)));
    const moved = !patchWin || Math.abs(mx - patchWin.mx) > patchWin.hw * 0.3 || Math.abs(my - patchWin.my) > patchWin.hw * 0.3 || patchWin.hw < hw * 0.9 || patchWin.hw > hw * 2.2 || z !== patchZ || baseOn !== patchBase;
    if (!moved && !patchDirty) return;
    patchLast = now;
    if (moved){
      patchWin = { mx, my, hw }; patchZ = z; patchBase = baseOn;
      const pos = patchGeo.attributes.position.array;
      for (let j = 0; j <= PN; j++) for (let i = 0; i <= PN; i++){
        const lon = (mx - hw + 2 * hw * i / PN) * 360 - 180, lat = mercLat(Math.max(0, Math.min(1, my - hw + 2 * hw * j / PN)));
        const v = latLonToVec3(lat, lon, EARTH_R), k = (j * (PN + 1) + i) * 3; pos[k] = v.x; pos[k + 1] = v.y; pos[k + 2] = v.z;
      }
      patchGeo.attributes.position.needsUpdate = true;
    }
    patchDirty = false; tilePass++;
    const b = BASE.find(x => x.id === baseId) || BASE[0], W = 256 * Math.pow(2, patchZ), n = 1 << patchZ, S = 1024;
    const X0 = (patchWin.mx - patchWin.hw) * W, Y0 = (patchWin.my - patchWin.hw) * W, sc = S / (2 * patchWin.hw * W);
    let tot = 0, got = 0;
    const drawL = (L, count) => { // one tile layer drawn into the patch; max-zoom limited layers are stretched beyond their last level
      const tz = Math.min(patchZ, L.max), ts = W / (1 << tz), N = 1 << tz, ext = 2 * patchWin.hw * W;
      const tx0 = Math.floor(X0 / ts), tx1 = Math.floor((X0 + ext) / ts), ty0 = Math.max(0, Math.floor(Y0 / ts)), ty1 = Math.min(N - 1, Math.floor((Y0 + ext) / ts));
      for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++){
        const wx = ((tx % N) + N) % N, dx = (tx * ts - X0) * sc, dy = (ty * ts - Y0) * sc, sz = ts * sc + 0.7;
        if (count) tot++;
        for (let up = 0; up <= 3 && tz - up >= 0; up++){ // fall back to a coarser cached tile while the sharp one loads
          const fq = 1 << up, url = tileUrl(L, tz - up, wx >> up, ty >> up), t = ptile(url, !up, Math.abs(dx - S / 2 + sz / 2) + Math.abs(dy - S / 2 + sz / 2));
          if (t && t.ok){ const ss = 256 / fq; PCTX.drawImage(t.img, (wx & (fq - 1)) * ss, (ty & (fq - 1)) * ss, ss, ss, dx, dy, sz, sz); if (count) got++; break; }
        }
      }
    };
    PCTX.clearRect(0, 0, S, S);
    if (baseOn){ if (b.under) drawL(BASE.find(x => x.id === b.under)); drawL(b, true); }
    if (ovOn.labels) drawL(OVER[0]); // country borders, place names
    for (const o of OVER) if (o.id !== 'labels' && ovOn[o.id] && o.url && !o.col && baseOn){ PCTX.globalAlpha = o.a; drawL(o); PCTX.globalAlpha = 1; }
    patchReady = baseOn ? (tot ? got / tot : 0) : (ovOn.labels ? 1 : 0);
    patchTex.needsUpdate = true;
  }
  // Everything that floats just above the ground (flights, cameras, ships, pins) lives in one group whose height is squeezed toward the surface as you zoom right in,
  // so markers stay on top of the map and are never closer to the camera than its near plane.
  const lowGroup = new THREE.Group(); globeGroup.add(lowGroup);
  [fltPts, milPts, evtPts, camPts, shipPts, shipLine, shipProj, allTrail, allProj, marker, selRing].forEach(o => { if (o) lowGroup.add(o); });
  function animate(){
    requestAnimationFrame(animate);
    cloudMesh.rotation.y += 0.00025 * Math.max(0.05, Math.min(1, (camera.position.length() - 1) / 2.4));
    pulseQuakes(performance.now());
    stepPlanes(performance.now());
    { const u = fltPts.material.uniforms; u.scale.value = renderer.domElement.height / 2; u.aspect.value = renderer.domElement.width / renderer.domElement.height; }
    { const pf = Math.max(0.004, Math.min(1, (camera.position.length() - 1) / 2.4)), ph = 0.17 * pf; marker.scale.set(ph * PIN_ASPECT, ph, 1);
      if (selRing.visible || selEnt){ const rp = selRing.getWorldPosition(new THREE.Vector3()), rs = 0.07 * pf; selRing.scale.set(rs, rs, 1); selRing.visible = !!selEnt && rp.dot(camera.position) > rp.lengthSq(); }
      if (markerLatLon){ const wp = marker.getWorldPosition(new THREE.Vector3()); marker.visible = wp.dot(camera.position) > wp.lengthSq(); } } // drawn over the globe, hidden only when the spot is on the far side // pin keeps a steady size on screen
    updateGodEye(performance.now());
    { const f = Math.max(0.002, Math.min(1, (camera.position.length() - 1) / 2.4)); // keep dots a steady on-screen size when zoomed in
      [fltPts, milPts, evtPts, camPts, shipPts].concat(satGroups.map(g => g.pts)).forEach(p => { if (!p) return; const m = p.material; if (m.userData.base == null) m.userData.base = m.size; m.size = m.userData.base * f; }); }
    { const dist = camera.position.length(), alt = dist - 1;
      controls.zoomSpeed = Math.min(1, (alt / dist) * 1.4); // zoom in steps of a fixed share of the height above ground, so it keeps going smoothly down to street level
      const nr = Math.max(0.0006, Math.min(0.5, alt * 0.1)); if (Math.abs(camera.near - nr) > nr * 0.05){ camera.near = nr; camera.far = 200; camera.updateProjectionMatrix(); }
      { const k = Math.max(0.3, Math.min(1, alt / 0.06)); lowGroup.scale.setScalar((1 + 0.006 * k) / 1.006);
        const close = alt < 0.03;
        patchMesh.scale.setScalar(close ? 1.0002 : 1.0025); }
      try { updatePatch(); } catch (e) { patchMesh.visible = false; patchMesh.material.opacity = 0; if (!window._patchErr){ window._patchErr = 1; console.warn('detail patch off', e); } } }
    controls.rotateSpeed = 0.7 * Math.max(0.001, Math.min(1, (camera.position.length() - 1) / 2.4));
    controls.autoRotateSpeed = 0.35 * Math.max(0.002, Math.min(1, (camera.position.length() - 1) / 2.4)); // spin slows as you zoom in, so the ground drifts at a steady pace
    controls.update();
    updateSun();
    renderer.render(scene, camera);
    updateCompass();
  }
  animate();

  // Hide loading screen once the day texture is ready (or after a timeout fallback)
  let revealed = false;
  function reveal(){
    if (revealed) return;
    revealed = true;
    if (usedFallbackMap) {
      const p = document.querySelector('.loading p');
      if (p) p.textContent = 'using offline fallback map';
    }
    loading.classList.add('hide');
    setTimeout(() => loading.style.display = 'none', 650);
  }
  const check = setInterval(() => {
    if (dayLoaded) { reveal(); clearInterval(check); }
  }, 150);
  setTimeout(reveal, 6000); // fallback so the app never hangs indefinitely

  // ---- Restore the view from a shared link ----
  (function applyHash(){
    if (!location.hash) return;
    const b = HASH.get('b'); if (b && BASE.some(x => x.id === b)) baseId = b;
    if (HASH.has('o')){
      Object.keys(ovOn).forEach(k => delete ovOn[k]);
      HASH.get('o').split(',').filter(Boolean).forEach(k => { if (OVER.some(o => o.id === k)) ovOn[k] = true; });
      if (ovOn.radar) loadRadar();
    }
    const lat = parseFloat(HASH.get('lat')), lon = parseFloat(HASH.get('lon')), z = parseFloat(HASH.get('z'));
    if (isFinite(lat) && isFinite(lon)){ mapCenterLat = Math.max(-85, Math.min(85, lat)); mapCenterLon = lon; }
    if (isFinite(z)) mapZoom = clampZoom(z);
    syncSheet();
    const m = HASH.get('m'); if (m === 'map' || m === 'god') setMode(m);
  })();

  // ---- PWA: register service worker for installability + offline shell ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
})();
</script>
</body>
