<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Terlask — an explorable Earth</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#04050a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #04050a;
    --void-2: #0a0d16;
    --panel: rgba(10, 13, 22, 0.72);
    --line: rgba(212, 175, 106, 0.18);
    --gold: #d4af6a;
    --gold-dim: #7a6a45;
    --text: #e9e7e0;
    --text-dim: #8b8a97;
    --sans: 'Space Grotesk', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: var(--sans);
    color: var(--text);
    touch-action: none;
    overscroll-behavior: none;
  }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .veil {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(4,5,10,0.55) 100%);
    pointer-events: none;
    z-index: 5;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 18px 18px 0;
    z-index: 20;
    pointer-events: none;
  }
  .brand { pointer-events: auto; }
  .brand h1 {
    font-size: 19px; font-weight: 600; letter-spacing: 0.3px;
    color: var(--text);
  }
  .brand p {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .layer-toggles {
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: auto;
  }
  .chip {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 11px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 20px;
    font-size: 11.5px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .chip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.15s, box-shadow 0.15s;
  }
  .chip.active { color: var(--text); border-color: var(--gold-dim); }
  .chip.active .dot { background: var(--gold); box-shadow: 0 0 5px var(--gold); }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 0 18px calc(18px + env(safe-area-inset-bottom, 12px));
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px;
    z-index: 20;
    pointer-events: none;
  }
  .search-wrap { flex: 1; max-width: 320px; pointer-events: auto; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 11px 16px;
  }
  .search-box svg { flex-shrink: 0; opacity: 0.6; }
  .search-box input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--sans); font-size: 13.5px;
  }
  .search-box input::placeholder { color: var(--text-dim); }
  .search-status {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    margin-top: 6px; padding-left: 4px; min-height: 14px;
  }
  .search-status.err { color: #c97a6a; }

  .readout {
    pointer-events: auto;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 13px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    line-height: 1.6;
    flex-shrink: 0;
  }
  .readout .label { color: var(--gold-dim); margin-right: 4px; }
  .readout .val { color: var(--text); }

  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    background: var(--void);
    z-index: 100;
    transition: opacity 0.6s ease;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading .ring {
    width: 34px; height: 34px;
    border: 2px solid var(--line);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  .loading p { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .compass {
    position: fixed;
    right: 18px;
    bottom: calc(96px + env(safe-area-inset-bottom, 12px));
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    z-index: 30;
    cursor: pointer;
    user-select: none;
  }
  .compass svg { width: 100%; height: 100%; }
  .compass .needle { transform-origin: 27px 27px; transition: transform 0.05s linear; }

  .mode-switch {
    position: fixed;
    left: 18px;
    top: 64px;
    z-index: 21;
    display: flex;
    gap: 2px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 3px;
    pointer-events: auto;
  }
  .mode-switch button {
    appearance: none; border: none; background: none;
    font-family: var(--sans); font-size: 12px; color: var(--text-dim);
    padding: 6px 13px; border-radius: 14px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode-switch button.active { background: rgba(212, 175, 106, 0.16); color: var(--gold); }

  #map-wrap {
    position: fixed; inset: 0;
    background: var(--void);
    z-index: 1;
    display: none;
  }
  #map-wrap.active { display: block; }
  #map-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #map-canvas:active { cursor: grabbing; }

  @media (max-width: 420px) {
    .brand h1 { font-size: 16px; }
    .bottom-bar { flex-direction: column; align-items: stretch; gap: 8px; }
    .search-wrap { max-width: none; }
    .readout { align-self: flex-start; }
    .mode-switch { top: 58px; }
    .mode-switch button { padding: 6px 11px; font-size: 11.5px; }
  }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="ring"></div>
  <p>assembling the planet…</p>
</div>

<div id="canvas-wrap"></div>
<div id="map-wrap"><canvas id="map-canvas"></canvas></div>
<div class="veil"></div>

<div class="mode-switch" id="mode-switch">
  <button type="button" data-mode="globe" class="active">Globe</button>
  <button type="button" data-mode="map">Map</button>
</div>

<header>
  <div class="brand">
    <h1>Terlask</h1>
    <p id="brand-sub">drag to rotate · pinch to zoom · tap to mark</p>
  </div>
  <div class="layer-toggles">
    <div class="chip active" data-toggle="clouds"><span class="dot"></span>Clouds</div>
    <div class="chip" data-toggle="night"><span class="dot"></span>Night mode</div>
    <div class="chip active" data-toggle="spin"><span class="dot"></span>Auto-rotate</div>
  </div>
</header>

<div class="compass" id="compass" title="Tap to face north">
  <svg viewBox="0 0 54 54">
    <circle cx="27" cy="27" r="25" fill="none" stroke="var(--line)" stroke-width="1"/>
    <text x="27" y="10" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8a97">N</text>
    <text x="27" y="49" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8a97">S</text>
    <text x="7" y="30" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8a97">W</text>
    <text x="47" y="30" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8a97">E</text>
    <g class="needle" id="compass-needle">
      <polygon points="27,15 31,27 27,24 23,27" fill="#d4af6a"/>
      <polygon points="27,39 31,27 27,30 23,27" fill="#565463"/>
    </g>
  </svg>
</div>

<div class="bottom-bar">
  <div class="search-wrap">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="search-input" placeholder="Fly to a place…" autocomplete="off" />
    </div>
    <div class="search-status" id="search-status"></div>
  </div>
  <div class="readout" id="readout">
    <div><span class="label">LAT</span><span class="val" id="val-lat">—</span></div>
    <div><span class="label">LON</span><span class="val" id="val-lon">—</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  const wrap = document.getElementById('canvas-wrap');
  const loading = document.getElementById('loading');
  let currentMode = 'globe'; // 'globe' (home) or 'map' (2D)

  // ---- Scene setup ----
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.6, 3.4);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  wrap.appendChild(renderer.domElement);

  // ---- Starfield (procedural, no external texture needed) ----
  function buildStars(){
    const geo = new THREE.BufferGeometry();
    const count = 2600;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 40 + Math.random() * 60;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i*3+2] = r * Math.cos(phi);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, sizeAttenuation: true, transparent: true, opacity: 0.75 });
    return new THREE.Points(geo, mat);
  }
  scene.add(buildStars());

  // ---- Lighting: sun position matches the real subsolar point right now ----
  // Both the light and its target are children of globeGroup, so they stay locked
  // to the correct latitude/longitude on the texture even as the globe is
  // rotated by dragging, auto-rotate, or the compass reset.
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  const sunTarget = new THREE.Object3D();
  sunTarget.position.set(0, 0, 0);
  const ambientLight = new THREE.AmbientLight(0x30364a, 0.4);
  scene.add(ambientLight);

  function getSubsolarPoint(date){
    const utcHours = date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600;
    let lon = -15 * (utcHours - 12);
    lon = ((lon + 180) % 360 + 360) % 360 - 180;
    const start = Date.UTC(date.getUTCFullYear(), 0, 0);
    const dayOfYear = (date.getTime() - start) / 86400000;
    const decl = -23.44 * Math.cos((2 * Math.PI / 365.24) * (dayOfYear + 10));
    return { lat: decl, lon };
  }

  // ---- Earth ----
  const EARTH_R = 1;
  const globeGroup = new THREE.Group();
  scene.add(globeGroup);
  globeGroup.add(sun);
  globeGroup.add(sunTarget);
  sun.target = sunTarget;

  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';

  const TEX_SOURCES = {
    day: [
      'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=BlueMarble_NextGeneration&STYLES=&SRS=EPSG:4326&BBOX=-180,-90,180,90&WIDTH=4096&HEIGHT=2048&FORMAT=image/jpeg',
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_atmos_2048.jpg',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_atmos_2048.jpg',
      'https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/textures/planets/earth_atmos_2048.jpg'
    ],
    specular: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_specular_2048.jpg',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_specular_2048.jpg'
    ],
    normal: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_normal_2048.jpg',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_normal_2048.jpg'
    ],
    night: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_lights_2048.png',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_lights_2048.png'
    ],
    clouds: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_clouds_1024.png',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_clouds_1024.png'
    ]
  };

  // Simple hand-drawn fallback map, used only if every online source fails,
  // so the globe always shows a recognizable land/ocean map, never a blank sphere.
  function makeFallbackEarthCanvas(){
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#0d3b66');
    grad.addColorStop(1, '#08243f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);
    ctx.fillStyle = '#3d7a54';
    function blob(x, y, w, h){ ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2); ctx.fill(); }
    blob(170, 190, 95, 75); blob(230, 280, 60, 95); blob(120, 340, 50, 40);
    blob(520, 150, 115, 60); blob(560, 260, 75, 55); blob(600, 340, 55, 45);
    blob(760, 175, 85, 60); blob(820, 320, 100, 70); blob(880, 400, 60, 40);
    blob(950, 140, 70, 50); blob(40, 130, 55, 35);
    return c;
  }

  function loadTextureChain(urls, onLoad, onFail){
    const texture = new THREE.Texture();
    const imgLoader = new THREE.ImageLoader();
    imgLoader.crossOrigin = 'anonymous';
    let i = 0;
    function tryNext(){
      if (i >= urls.length) { onFail && onFail(texture); return; }
      const url = urls[i++];
      imgLoader.load(url, (image) => {
        texture.image = image;
        texture.needsUpdate = true;
        onLoad && onLoad(texture);
      }, undefined, tryNext);
    }
    tryNext();
    return texture;
  }

  let dayLoaded = false;
  let usedFallbackMap = false;
  const dayTex = loadTextureChain(TEX_SOURCES.day, () => { dayLoaded = true; if (currentMode === 'map') drawMap(); }, (tex) => {
    tex.image = makeFallbackEarthCanvas();
    tex.needsUpdate = true;
    dayLoaded = true;
    usedFallbackMap = true;
    if (currentMode === 'map') drawMap();
  });
  const specTex = loadTextureChain(TEX_SOURCES.specular);
  const normalTex = loadTextureChain(TEX_SOURCES.normal);
  const nightTex = loadTextureChain(TEX_SOURCES.night, () => { if (currentMode === 'map') drawMap(); });
  const cloudTex = loadTextureChain(TEX_SOURCES.clouds, () => { if (currentMode === 'map') drawMap(); }, () => {
    if (typeof cloudMesh !== 'undefined') cloudMesh.visible = false;
  });

  const earthMat = new THREE.MeshPhongMaterial({
    map: dayTex,
    specularMap: specTex,
    normalMap: normalTex,
    normalScale: new THREE.Vector2(0.6, 0.6),
    specular: new THREE.Color(0x1a1a1a),
    shininess: 6
  });
  const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R, 64, 64), earthMat);
  globeGroup.add(earthMesh);

  // Night lights: an emissive overlay sphere, blended in additively, visible on the dark side
  const nightMat = new THREE.MeshBasicMaterial({
    map: nightTex,
    blending: THREE.AdditiveBlending,
    transparent: true,
    opacity: 0
  });
  const nightMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R * 1.001, 64, 64), nightMat);
  globeGroup.add(nightMesh);

  // Clouds
  const cloudMat = new THREE.MeshLambertMaterial({
    map: cloudTex,
    transparent: true,
    opacity: 0.5,
    depthWrite: false
  });
  const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R * 1.012, 64, 64), cloudMat);
  globeGroup.add(cloudMesh);

  // Atmosphere glow (simple additive rim sphere)
  const atmoMat = new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader: `
      varying vec3 vNormal;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      void main(){
        float intensity = pow(0.68 - dot(vNormal, vec3(0,0,1.0)), 3.5);
        gl_FragColor = vec4(0.4, 0.65, 1.0, 1.0) * intensity;
      }
    `,
    blending: THREE.AdditiveBlending,
    transparent: true,
    side: THREE.BackSide
  });
  const atmoMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R * 1.12, 64, 64), atmoMat);
  scene.add(atmoMesh);

  // Marker for tapped location
  const markerGeo = new THREE.SphereGeometry(0.014, 12, 12);
  const markerMat = new THREE.MeshBasicMaterial({ color: 0x8a5a1e });
  const marker = new THREE.Mesh(markerGeo, markerMat);
  marker.visible = false;
  globeGroup.add(marker);

  // ---- Controls ----
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 10;
  controls.rotateSpeed = 0.7;
  controls.zoomSpeed = 0.7;
  controls.enablePan = false;
  controls.minPolarAngle = 0.05;
  controls.maxPolarAngle = Math.PI - 0.05;
  controls.touches = {
    ONE: THREE.TOUCH.ROTATE,
    TWO: THREE.TOUCH.DOLLY_ROTATE
  };

  let autoRotate = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;

  // ---- Lat/Lon <-> 3D helpers ----
  function latLonToVec3(lat, lon, radius){
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lon + 180) * (Math.PI / 180);
    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }
  function vec3ToLatLon(v){
    const radius = v.length();
    const lat = 90 - (Math.acos(v.y / radius) * 180 / Math.PI);
    const lon = ((Math.atan2(v.z, -v.x) * 180 / Math.PI) - 180 + 360) % 360 - 180;
    return { lat, lon: lon > 180 ? lon - 360 : lon };
  }

  // ---- Raycasting for tap-to-mark ----
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const valLat = document.getElementById('val-lat');
  const valLon = document.getElementById('val-lon');

  // Shared marker state — a single pin that's kept in sync between the
  // 3D globe and the 2D map, whichever view is currently active.
  let markerLatLon = null;
  function setMarker(lat, lon){
    markerLatLon = { lat, lon };
    valLat.textContent = lat.toFixed(2) + '°';
    valLon.textContent = lon.toFixed(2) + '°';
    const local = latLonToVec3(lat, lon, EARTH_R * 1.005);
    marker.position.copy(local);
    marker.visible = true;
    if (currentMode === 'map') drawMap();
  }

  function onPointerTap(clientX, clientY){
    pointer.x = (clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObject(earthMesh);
    if (hits.length > 0) {
      const local = globeGroup.worldToLocal(hits[0].point.clone());
      const { lat, lon } = vec3ToLatLon(local);
      setMarker(lat, lon);
    }
  }

  let downPos = null;
  renderer.domElement.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!downPos) return;
    const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    if (dist < 6) onPointerTap(e.clientX, e.clientY); // treat as tap, not drag
    downPos = null;
  });

  // ---- Fly-to animation ----
  let flying = false;
  function getNorthTangent(P){
    const N = new THREE.Vector3(0, 1, 0);
    const tangent = N.clone().sub(P.clone().multiplyScalar(N.dot(P)));
    if (tangent.lengthSq() < 1e-8) tangent.set(1, 0, 0); // P is exactly at a pole; any perpendicular works
    return tangent.normalize();
  }

  function flyTo(lat, lon){
    flying = true;
    const startQuat = globeGroup.quaternion.clone();

    // Solve for the one orientation where the place both faces the camera
    // AND keeps north pointing up on screen, like a real map.
    const targetDir = latLonToVec3(lat, lon, 1).normalize();   // local: outward normal at the place
    const localUp = getNorthTangent(targetDir);                 // local: toward north at that point
    const localRight = new THREE.Vector3().crossVectors(localUp, targetDir).normalize();

    const cameraDir = camera.position.clone().normalize();     // world: direction the camera looks from
    const worldUpRaw = new THREE.Vector3(0, 1, 0);
    const worldUp = worldUpRaw.clone().sub(cameraDir.clone().multiplyScalar(worldUpRaw.dot(cameraDir)));
    if (worldUp.lengthSq() < 1e-8) worldUp.set(0, 0, 1); // edge case: camera looking straight along world up
    worldUp.normalize();
    const worldRight = new THREE.Vector3().crossVectors(worldUp, cameraDir).normalize();

    const A = new THREE.Matrix4().makeBasis(localRight, localUp, targetDir);
    const B = new THREE.Matrix4().makeBasis(worldRight, worldUp, cameraDir);
    const R = new THREE.Matrix4().multiplyMatrices(B, A.clone().transpose());
    const endQuat = new THREE.Quaternion().setFromRotationMatrix(R);

    const startTime = performance.now();
    const duration = 1400;
    controls.autoRotate = false;

    function step(now){
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      globeGroup.quaternion.slerpQuaternions(startQuat, endQuat, eased);
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        flying = false;
        controls.autoRotate = autoRotate;
        setMarker(lat, lon);
      }
    }
    requestAnimationFrame(step);
  }

  // ---- 2D map (equirectangular) ----
  // Reuses the same textures already loaded for the globe, so it works
  // offline exactly as reliably as the 3D view and never issues a second
  // network request just to draw the flat map.
  const mapCanvas = document.getElementById('map-canvas');
  const mapCtx = mapCanvas.getContext('2d');
  const mapWrapEl = document.getElementById('map-wrap');
  let mapCenterLon = 0, mapCenterLat = 0, mapZoom = 1;

  function clampZoom(z){ return Math.max(1, Math.min(24, z)); }

  function mapMetrics(){
    const CW = window.innerWidth, CH = window.innerHeight;
    const basePxPerDeg = Math.min(CW / 360, CH / 180);
    return { CW, CH, pxPerDeg: basePxPerDeg * mapZoom };
  }

  function screenToLatLon(px, py){
    const { CW, CH, pxPerDeg } = mapMetrics();
    let lon = mapCenterLon + (px - CW / 2) / pxPerDeg;
    lon = ((lon + 180) % 360 + 360) % 360 - 180;
    const lat = Math.max(-90, Math.min(90, mapCenterLat - (py - CH / 2) / pxPerDeg));
    return { lat, lon };
  }

  function mapLonToX(lon, CW, pxPerDeg){
    let d = lon - mapCenterLon;
    d = ((d + 180) % 360 + 360) % 360 - 180;
    return CW / 2 + d * pxPerDeg;
  }
  function mapLatToY(lat, CH, pxPerDeg){
    return CH / 2 + (mapCenterLat - lat) * pxPerDeg;
  }

  function resizeMapCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    mapCanvas.width = Math.round(window.innerWidth * dpr);
    mapCanvas.height = Math.round(window.innerHeight * dpr);
    mapCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawMap(){
    const { CW, CH, pxPerDeg } = mapMetrics();
    mapCtx.clearRect(0, 0, CW, CH);
    mapCtx.fillStyle = '#04050a';
    mapCtx.fillRect(0, 0, CW, CH);

    const img = nightMode ? (nightTex.image || dayTex.image) : dayTex.image;
    if (!img) {
      mapCtx.fillStyle = '#8b8a97';
      mapCtx.font = '11px "JetBrains Mono", monospace';
      mapCtx.textAlign = 'center';
      mapCtx.fillText('assembling the map…', CW / 2, CH / 2);
      return;
    }

    const worldW = 360 * pxPerDeg, worldH = 180 * pxPerDeg;
    const centerPxX = (((mapCenterLon + 180) % 360 + 360) % 360) / 360 * worldW;
    const centerPxY = (90 - mapCenterLat) / 180 * worldH;
    const baseLeft = CW / 2 - centerPxX;
    const top = CH / 2 - centerPxY;

    for (let k = -2; k <= 2; k++){
      const x = baseLeft + k * worldW;
      if (x + worldW < 0 || x > CW) continue;
      mapCtx.drawImage(img, x, top, worldW, worldH);
      if (cloudMesh.visible && cloudTex.image){
        mapCtx.globalAlpha = 0.45;
        mapCtx.drawImage(cloudTex.image, x, top, worldW, worldH);
        mapCtx.globalAlpha = 1;
      }
    }

    if (markerLatLon){
      const mx = mapLonToX(markerLatLon.lon, CW, pxPerDeg);
      const my = mapLatToY(markerLatLon.lat, CH, pxPerDeg);
      mapCtx.beginPath();
      mapCtx.arc(mx, my, 6, 0, Math.PI * 2);
      mapCtx.fillStyle = '#d4af6a';
      mapCtx.fill();
      mapCtx.lineWidth = 2;
      mapCtx.strokeStyle = '#04050a';
      mapCtx.stroke();
    }
  }

  // Pan (drag), pinch-zoom, and tap-to-mark on the flat map
  const mapPointers = new Map();
  let mapDownPos = null, pinchStartDist = null, pinchStartZoom = null;

  mapCanvas.addEventListener('pointerdown', (e) => {
    mapCanvas.setPointerCapture(e.pointerId);
    mapPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mapPointers.size === 1) mapDownPos = { x: e.clientX, y: e.clientY };
    if (mapPointers.size === 2){
      const pts = [...mapPointers.values()];
      pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      pinchStartZoom = mapZoom;
    }
  });

  mapCanvas.addEventListener('pointermove', (e) => {
    if (!mapPointers.has(e.pointerId)) return;
    const prev = mapPointers.get(e.pointerId);
    mapPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (mapPointers.size === 1){
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      const { pxPerDeg } = mapMetrics();
      mapCenterLon -= dx / pxPerDeg;
      mapCenterLon = ((mapCenterLon + 180) % 360 + 360) % 360 - 180;
      mapCenterLat = Math.max(-90, Math.min(90, mapCenterLat + dy / pxPerDeg));
      drawMap();
    } else if (mapPointers.size === 2 && pinchStartDist){
      const pts = [...mapPointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      mapZoom = clampZoom(pinchStartZoom * (dist / pinchStartDist));
      drawMap();
    }
  });

  function mapPointerEnd(e){
    if (mapPointers.size === 1 && mapDownPos){
      const dist = Math.hypot(e.clientX - mapDownPos.x, e.clientY - mapDownPos.y);
      if (dist < 6){
        const { lat, lon } = screenToLatLon(e.clientX, e.clientY);
        setMarker(lat, lon);
      }
    }
    mapPointers.delete(e.pointerId);
    if (mapPointers.size < 2) pinchStartDist = null;
    if (mapPointers.size === 0) mapDownPos = null;
  }
  mapCanvas.addEventListener('pointerup', mapPointerEnd);
  mapCanvas.addEventListener('pointercancel', mapPointerEnd);

  mapCanvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const { CW, CH, pxPerDeg: pxPerDegOld } = mapMetrics();
    const { lat, lon } = screenToLatLon(e.clientX, e.clientY);
    mapZoom = clampZoom(mapZoom * Math.exp(-e.deltaY * 0.0015));
    const { pxPerDeg: pxPerDegNew } = mapMetrics();
    mapCenterLon = lon - (e.clientX - CW / 2) / pxPerDegNew;
    mapCenterLon = ((mapCenterLon + 180) % 360 + 360) % 360 - 180;
    mapCenterLat = Math.max(-90, Math.min(90, lat + (e.clientY - CH / 2) / pxPerDegNew));
    drawMap();
  }, { passive: false });

  // Routes a searched place to whichever view is currently active
  function goToPlace(lat, lon){
    if (currentMode === 'globe'){
      flyTo(lat, lon);
    } else {
      mapCenterLat = Math.max(-90, Math.min(90, lat));
      mapCenterLon = lon;
      mapZoom = Math.max(mapZoom, 6);
      setMarker(lat, lon);
      drawMap();
    }
  }

  // ---- Mode switch: Globe (home) <-> flat Map ----
  const brandSub = document.getElementById('brand-sub');
  function setMode(mode){
    currentMode = mode;
    document.querySelectorAll('.mode-switch button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    const spinChip = document.querySelector('.chip[data-toggle="spin"]');
    const compassBtn = document.getElementById('compass');
    if (mode === 'globe'){
      wrap.style.display = '';
      mapWrapEl.classList.remove('active');
      if (compassBtn) compassBtn.style.display = '';
      if (spinChip) spinChip.style.display = '';
      brandSub.textContent = 'drag to rotate · pinch to zoom · tap to mark';
      controls.autoRotate = autoRotate && !flying;
    } else {
      wrap.style.display = 'none';
      mapWrapEl.classList.add('active');
      if (compassBtn) compassBtn.style.display = 'none';
      if (spinChip) spinChip.style.display = 'none';
      brandSub.textContent = 'drag to pan · scroll to zoom · tap to mark';
      resizeMapCanvas();
      drawMap();
    }
  }
  document.querySelectorAll('.mode-switch button').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });
  resizeMapCanvas();


  // ---- Search / geocoding ----
  const searchInput = document.getElementById('search-input');
  const searchStatus = document.getElementById('search-status');

  async function geocode(query){
    searchStatus.className = 'search-status';
    searchStatus.textContent = 'searching…';
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const results = await res.json();
      if (!results.length) {
        searchStatus.textContent = 'no place found — try a different spelling';
        searchStatus.classList.add('err');
        return;
      }
      const { lat, lon, display_name } = results[0];
      const latNum = parseFloat(lat), lonNum = parseFloat(lon);
      const latDir = latNum >= 0 ? 'N' : 'S';
      const lonDir = lonNum >= 0 ? 'E' : 'W';
      const coordStr = `${Math.abs(latNum).toFixed(2)}°${latDir}, ${Math.abs(lonNum).toFixed(2)}°${lonDir}`;
      searchStatus.textContent = display_name.split(',').slice(0,2).join(',') + ' · ' + coordStr;
      goToPlace(parseFloat(lat), parseFloat(lon));
    } catch (e) {
      searchStatus.textContent = 'search unavailable right now — try again shortly';
      searchStatus.classList.add('err');
    }
  }

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && searchInput.value.trim()) {
      geocode(searchInput.value.trim());
    }
  });

  // ---- Layer toggle chips ----
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.dataset.toggle;
      const active = chip.classList.toggle('active');
      if (key === 'clouds') {
        cloudMesh.visible = active;
        if (currentMode === 'map') drawMap();
      } else if (key === 'night') {
        nightMode = active;
        applyDayNightMode();
        if (currentMode === 'map') drawMap();
      } else if (key === 'spin') {
        autoRotate = active;
        if (!flying) controls.autoRotate = active;
      }
    });
  });

  // ---- Resize ----
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    resizeMapCanvas();
    if (currentMode === 'map') drawMap();
  });

  // ---- Compass ----
  const compassNeedle = document.getElementById('compass-needle');
  const compassEl = document.getElementById('compass');
  const _tmpNorth = new THREE.Vector3();
  const _tmpOrigin = new THREE.Vector3();

  function updateCompass(){
    _tmpOrigin.set(0, 0, 0).applyMatrix4(globeGroup.matrixWorld).project(camera);
    _tmpNorth.set(0, EARTH_R * 1.4, 0).applyMatrix4(globeGroup.matrixWorld).project(camera);
    const dx = _tmpNorth.x - _tmpOrigin.x;
    const dy = _tmpNorth.y - _tmpOrigin.y; // NDC y is up already
    const angleDeg = Math.atan2(dx, dy) * (180 / Math.PI);
    compassNeedle.style.transform = `rotate(${angleDeg}deg)`;
  }

  function resetNorth(){
    const startQuat = globeGroup.quaternion.clone();
    const endQuat = new THREE.Quaternion();
    const startTime = performance.now();
    const duration = 700;
    controls.autoRotate = false;
    function step(now){
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      globeGroup.quaternion.slerpQuaternions(startQuat, endQuat, eased);
      if (t < 1) requestAnimationFrame(step);
      else controls.autoRotate = autoRotate;
    }
    requestAnimationFrame(step);
  }
  compassEl.addEventListener('click', resetNorth);

  // ---- Day / Night mode: whole-globe toggle, not a partial terminator ----
  let nightMode = false;
  function applyDayNightMode(){
    if (nightMode) {
      sun.intensity = 0;
      ambientLight.intensity = 0.12;
      ambientLight.color.set(0x1a2440);
      nightMat.opacity = 1;
    } else {
      sun.intensity = 1.05;
      ambientLight.intensity = 0.8;
      ambientLight.color.set(0xffffff);
      nightMat.opacity = 0;
    }
  }
  applyDayNightMode();

  // ---- Render loop ----
  function updateSun(){
    const { lat, lon } = getSubsolarPoint(new Date());
    sun.position.copy(latLonToVec3(lat, lon, 6));
  }

  function animate(){
    requestAnimationFrame(animate);
    cloudMesh.rotation.y += 0.00025;
    controls.update();
    updateSun();
    renderer.render(scene, camera);
    updateCompass();
  }
  animate();

  // Hide loading screen once the day texture is ready (or after a timeout fallback)
  let revealed = false;
  function reveal(){
    if (revealed) return;
    revealed = true;
    if (usedFallbackMap) {
      const p = document.querySelector('.loading p');
      if (p) p.textContent = 'using offline fallback map';
    }
    loading.classList.add('hide');
    setTimeout(() => loading.style.display = 'none', 650);
  }
  const check = setInterval(() => {
    if (dayLoaded) { reveal(); clearInterval(check); }
  }, 150);
  setTimeout(reveal, 6000); // fallback so the app never hangs indefinitely

  // ---- PWA: register service worker for installability + offline shell ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
