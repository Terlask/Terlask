<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Terlask — an explorable Earth</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#04050a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #04050a;
    --void-2: #0a0d16;
    --panel: rgba(10, 13, 22, 0.72);
    --line: rgba(212, 175, 106, 0.18);
    --gold: #d4af6a;
    --gold-dim: #7a6a45;
    --text: #e9e7e0;
    --text-dim: #8b8a97;
    --sans: 'Space Grotesk', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: var(--sans);
    color: var(--text);
    touch-action: none;
    overscroll-behavior: none;
  }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .veil {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(4,5,10,0.55) 100%);
    pointer-events: none;
    z-index: 5;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 18px 18px 0;
    z-index: 20;
    pointer-events: none;
  }
  .brand { pointer-events: auto; }
  .brand h1 {
    font-size: 19px; font-weight: 600; letter-spacing: 0.3px;
    color: var(--text);
  }
  .brand p {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .layer-toggles {
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: auto;
  }
  .chip {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 11px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 20px;
    font-size: 11.5px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .chip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.15s, box-shadow 0.15s;
  }
  .chip.active { color: var(--text); border-color: var(--gold-dim); }
  .chip.active .dot { background: var(--gold); box-shadow: 0 0 5px var(--gold); }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 0 18px calc(18px + env(safe-area-inset-bottom, 12px));
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px;
    z-index: 20;
    pointer-events: none;
  }
  .search-wrap { flex: 1; max-width: 320px; pointer-events: auto; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 11px 16px;
  }
  .search-box svg { flex-shrink: 0; opacity: 0.6; }
  .search-box input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--sans); font-size: 13.5px;
  }
  .search-box input::placeholder { color: var(--text-dim); }
  .search-status {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    margin-top: 6px; padding-left: 4px; min-height: 14px;
  }
  .search-status.err { color: #c97a6a; }

  .readout {
    pointer-events: auto;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 13px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    line-height: 1.6;
    flex-shrink: 0;
  }
  .readout .label { color: var(--gold-dim); margin-right: 4px; }
  .readout .val { color: var(--text); }

  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    background: var(--void);
    z-index: 100;
    transition: opacity 0.6s ease;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
  .loading .ring {
    width: 34px; height: 34px;
    border: 2px solid var(--line);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  .loading p { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .compass {
    position: fixed;
    right: 18px;
    bottom: calc(96px + env(safe-area-inset-bottom, 12px));
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    z-index: 30;
    cursor: pointer;
    user-select: none;
  }
  .compass svg { width: 100%; height: 100%; }
  .compass .needle { transform-origin: 27px 27px; transition: transform 0.05s linear; }

  .mode-switch {
    position: fixed;
    left: 18px;
    top: 64px;
    z-index: 21;
    display: flex;
    gap: 2px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 3px;
    pointer-events: auto;
  }
  .mode-switch button {
    appearance: none; border: none; background: none;
    font-family: var(--sans); font-size: 12px; color: var(--text-dim);
    padding: 6px 13px; border-radius: 14px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode-switch button.active { background: rgba(212, 175, 106, 0.16); color: var(--gold); }

  #map-wrap {
    position: fixed; inset: 0;
    background: var(--void);
    z-index: 1;
    display: none;
  }
  #map-wrap.active { display: block; }
  #map-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #map-canvas:active { cursor: grabbing; }

  .god-hud {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 25; display: none;
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 16px; font-family: var(--mono); font-size: 10.5px;
    color: var(--text-dim); line-height: 1.7; text-align: center;
    pointer-events: none; max-width: calc(100vw - 36px);
  }
  .god-hud .title { color: var(--gold); letter-spacing: 2px; font-size: 10px; margin-bottom: 2px; }
  .god-hud .val { color: var(--text); }
  body.god .god-hud { display: block; }
  body.god .layer-toggles, body.god .bottom-bar, body.god .compass { opacity: 0; pointer-events: none; }
  .layer-toggles, .bottom-bar, .compass { transition: opacity 0.4s; }

  .god-panel{position:fixed;right:18px;top:18px;z-index:26;display:none;flex-direction:column;gap:5px;width:190px}
  body.god .god-panel{display:flex}
  .gp-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;font-size:11px;color:var(--text-dim);cursor:pointer;user-select:none;opacity:.55;transition:opacity .15s,border-color .15s}
  .gp-row.on{opacity:1;border-color:var(--gold-dim);color:var(--text)}
  .gp-tag{font-family:var(--mono);font-size:9px;color:var(--gold);min-width:34px}
  .gp-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gp-n{font-family:var(--mono);font-size:10px;color:var(--text)}
  .god-card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:27;display:none;min-width:230px;max-width:calc(100vw - 36px);background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--gold-dim);border-radius:12px;padding:11px 14px;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);line-height:1.7;cursor:pointer;max-height:44vh;overflow:auto;touch-action:pan-y}
  .god-card.show{display:block}
  .god-card .gc-tag{color:var(--gold);letter-spacing:1.5px;font-size:9.5px}
  .god-card .gc-title{font-family:var(--sans);font-size:14px;color:var(--text);margin:2px 0 4px}
  .god-card span{color:var(--gold-dim);display:inline-block;min-width:88px}
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5fe08a;box-shadow:0 0 6px #5fe08a;margin-right:6px;animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  .gp-sw{width:10px;height:10px;border-radius:50%;flex:none}
  @media (max-width: 420px){.god-panel{width:152px;top:14px}.gp-tag{display:none}.brand{max-width:calc(100vw - 190px)}.god-card{bottom:calc(220px + env(safe-area-inset-bottom,0px))}}
  @media (max-width: 420px) {
    .brand h1 { font-size: 16px; }
    .bottom-bar { flex-direction: column; align-items: stretch; gap: 8px; }
    .search-wrap { max-width: none; }
    .readout { align-self: flex-start; }
    .mode-switch { top: 58px; }
    .mode-switch button { padding: 6px 11px; font-size: 11.5px; }
  }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="ring"></div>
  <p>assembling the planet…</p>
</div>

<div id="canvas-wrap"></div>
<div id="map-wrap"><canvas id="map-canvas"></canvas></div>
<div class="veil"></div>

<div class="mode-switch" id="mode-switch">
  <button type="button" data-mode="globe" class="active">Globe</button>
  <button type="button" data-mode="map">Map</button>
  <button type="button" data-mode="god">God's Eye</button>
</div>

<header>
  <div class="brand">
    <h1>Terlask</h1>
    <p id="brand-sub">drag to rotate · pinch to zoom · tap to mark</p>
  </div>
  <div class="layer-toggles">
    <div class="chip active" data-toggle="clouds"><span class="dot"></span>Clouds</div>
    <div class="chip" data-toggle="night"><span class="dot"></span>Night mode</div>
    <div class="chip active" data-toggle="spin"><span class="dot"></span>Auto-rotate</div>
    <div class="chip active" data-toggle="quakes"><span class="dot"></span>Earthquakes</div>
  </div>
</header>

<div class="compass" id="compass" title="Tap to face north">
  <svg viewBox="0 0 54 54">
    <circle cx="27" cy="27" r="25" fill="none" stroke="var(--line)" stroke-width="1"/>
    <text x="27" y="10" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8a97">N</text>
    <text x="27" y="49" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8a97">S</text>
    <text x="7" y="30" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8a97">W</text>
    <text x="47" y="30" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#8b8a97">E</text>
    <g class="needle" id="compass-needle">
      <polygon points="27,15 31,27 27,24 23,27" fill="#d4af6a"/>
      <polygon points="27,39 31,27 27,30 23,27" fill="#565463"/>
    </g>
  </svg>
</div>

<div class="god-hud" id="god-hud">
  <div class="title"><span class="live-dot"></span>SYSTEM ONLINE · GOD'S EYE</div>
  <div>UTC <span class="val" id="god-utc">—</span> · SUN <span class="val" id="god-sun">—</span></div>
  <div><span class="val" id="god-quakes">—</span></div>
  <div><span class="val" id="god-sats">loading satellites…</span></div>
</div>

<div class="god-panel" id="god-panel"></div>
<div class="god-card" id="god-card"></div>

<div class="bottom-bar">
  <div class="search-wrap">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="search-input" placeholder="Fly to a place…" autocomplete="off" />
    </div>
    <div class="search-status" id="search-status"></div>
  </div>
  <div class="readout" id="readout">
    <div><span class="label">LAT</span><span class="val" id="val-lat">—</span></div>
    <div><span class="label">LON</span><span class="val" id="val-lon">—</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.3/satellite.min.js"></script>
<script>
(function(){
  const wrap = document.getElementById('canvas-wrap');
  const loading = document.getElementById('loading');
  let currentMode = 'globe'; // 'globe' (home) or 'map' (2D)

  // ---- Scene setup ----
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.6, 3.4);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  wrap.appendChild(renderer.domElement);

  // ---- Starfield (procedural, no external texture needed) ----
  function buildStars(){
    const geo = new THREE.BufferGeometry();
    const count = 2600;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 40 + Math.random() * 60;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i*3+2] = r * Math.cos(phi);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, sizeAttenuation: true, transparent: true, opacity: 0.75 });
    return new THREE.Points(geo, mat);
  }
  scene.add(buildStars());

  // ---- Lighting: sun position matches the real subsolar point right now ----
  // Both the light and its target are children of globeGroup, so they stay locked
  // to the correct latitude/longitude on the texture even as the globe is
  // rotated by dragging, auto-rotate, or the compass reset.
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  const sunTarget = new THREE.Object3D();
  sunTarget.position.set(0, 0, 0);
  const ambientLight = new THREE.AmbientLight(0x30364a, 0.4);
  scene.add(ambientLight);

  function getSubsolarPoint(date){
    const utcHours = date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600;
    let lon = -15 * (utcHours - 12);
    lon = ((lon + 180) % 360 + 360) % 360 - 180;
    const start = Date.UTC(date.getUTCFullYear(), 0, 0);
    const dayOfYear = (date.getTime() - start) / 86400000;
    const decl = -23.44 * Math.cos((2 * Math.PI / 365.24) * (dayOfYear + 10));
    return { lat: decl, lon };
  }

  // ---- Earth ----
  const EARTH_R = 1;
  const globeGroup = new THREE.Group();
  scene.add(globeGroup);
  globeGroup.add(sun);
  globeGroup.add(sunTarget);
  sun.target = sunTarget;

  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';

  const TEX_SOURCES = {
    day: [
      'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=BlueMarble_NextGeneration&STYLES=&SRS=EPSG:4326&BBOX=-180,-90,180,90&WIDTH=4096&HEIGHT=2048&FORMAT=image/jpeg',
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_atmos_2048.jpg',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_atmos_2048.jpg',
      'https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/textures/planets/earth_atmos_2048.jpg'
    ],
    specular: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_specular_2048.jpg',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_specular_2048.jpg'
    ],
    normal: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_normal_2048.jpg',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_normal_2048.jpg'
    ],
    night: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_lights_2048.png',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_lights_2048.png'
    ],
    clouds: [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_clouds_1024.png',
      'https://unpkg.com/three@0.128.0/examples/textures/planets/earth_clouds_1024.png'
    ]
  };

  // Simple hand-drawn fallback map, used only if every online source fails,
  // so the globe always shows a recognizable land/ocean map, never a blank sphere.
  function makeFallbackEarthCanvas(){
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#0d3b66');
    grad.addColorStop(1, '#08243f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 512);
    ctx.fillStyle = '#3d7a54';
    function blob(x, y, w, h){ ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2); ctx.fill(); }
    blob(170, 190, 95, 75); blob(230, 280, 60, 95); blob(120, 340, 50, 40);
    blob(520, 150, 115, 60); blob(560, 260, 75, 55); blob(600, 340, 55, 45);
    blob(760, 175, 85, 60); blob(820, 320, 100, 70); blob(880, 400, 60, 40);
    blob(950, 140, 70, 50); blob(40, 130, 55, 35);
    return c;
  }

  function loadTextureChain(urls, onLoad, onFail){
    const texture = new THREE.Texture();
    const imgLoader = new THREE.ImageLoader();
    imgLoader.crossOrigin = 'anonymous';
    let i = 0;
    function tryNext(){
      if (i >= urls.length) { onFail && onFail(texture); return; }
      const url = urls[i++];
      imgLoader.load(url, (image) => {
        texture.image = image;
        texture.needsUpdate = true;
        onLoad && onLoad(texture);
      }, undefined, tryNext);
    }
    tryNext();
    return texture;
  }

  let dayLoaded = false;
  let usedFallbackMap = false;
  const dayTex = loadTextureChain(TEX_SOURCES.day, () => { dayLoaded = true; if (currentMode === 'map') drawMap(); }, (tex) => {
    tex.image = makeFallbackEarthCanvas();
    tex.needsUpdate = true;
    dayLoaded = true;
    usedFallbackMap = true;
    if (currentMode === 'map') drawMap();
  });
  const specTex = loadTextureChain(TEX_SOURCES.specular);
  const normalTex = loadTextureChain(TEX_SOURCES.normal);
  const nightTex = loadTextureChain(TEX_SOURCES.night, () => { if (currentMode === 'map') drawMap(); });
  const cloudTex = loadTextureChain(TEX_SOURCES.clouds, () => { if (currentMode === 'map') drawMap(); }, () => {
    if (typeof cloudMesh !== 'undefined') cloudMesh.visible = false;
  });

  const earthMat = new THREE.MeshPhongMaterial({
    map: dayTex,
    specularMap: specTex,
    normalMap: normalTex,
    normalScale: new THREE.Vector2(0.6, 0.6),
    specular: new THREE.Color(0x1a1a1a),
    shininess: 6
  });
  const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R, 64, 64), earthMat);
  globeGroup.add(earthMesh);

  // Night lights: an emissive overlay sphere, blended in additively, visible on the dark side
  const nightMat = new THREE.MeshBasicMaterial({
    map: nightTex,
    blending: THREE.AdditiveBlending,
    transparent: true,
    opacity: 0
  });
  const nightMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R * 1.001, 64, 64), nightMat);
  globeGroup.add(nightMesh);

  // Clouds
  const cloudMat = new THREE.MeshLambertMaterial({
    map: cloudTex,
    transparent: true,
    opacity: 0.5,
    depthWrite: false
  });
  const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R * 1.012, 64, 64), cloudMat);
  globeGroup.add(cloudMesh);

  // Atmosphere glow (simple additive rim sphere)
  const atmoMat = new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader: `
      varying vec3 vNormal;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      void main(){
        float intensity = pow(0.68 - dot(vNormal, vec3(0,0,1.0)), 3.5);
        gl_FragColor = vec4(0.4, 0.65, 1.0, 1.0) * intensity;
      }
    `,
    blending: THREE.AdditiveBlending,
    transparent: true,
    side: THREE.BackSide
  });
  const atmoMesh = new THREE.Mesh(new THREE.SphereGeometry(EARTH_R * 1.12, 64, 64), atmoMat);
  scene.add(atmoMesh);

  // Marker for tapped location
  const markerGeo = new THREE.SphereGeometry(0.014, 12, 12);
  const markerMat = new THREE.MeshBasicMaterial({ color: 0x8a5a1e });
  const marker = new THREE.Mesh(markerGeo, markerMat);

    try {
      const d = await jget('https://opensky-network.org/api/states/all');
      list = (d.states || []).filter(s => s[5] != null && s[6] != null && !s[8]).map(s => { const alt = s[13] != null ? s[13] : s[7];
        return { kind: 'flight', lon: s[5], lat: s[6], hex: s[0], call: (s[1] || '').trim() || s[0], country: s[2], alt, spd: s[9], hdg: s[10], vrate: s[11], squawk: s[14], col: altCol(alt) }; });
    } catch (e) { err = e; }
    G.flights.log = [['opensky', err ? errFull(err) : 'empty']];
    if (!list || !list.length){ try { list = await gridFlights(); G.flights.log.push(['adsb.lol / adsb.one', 'ok']); } catch (e) { err = e; G.flights.log.push(['adsb.lol / adsb.one', errFull(e)]); } }
    if (list && list.length){ flights = list; setPts(fltPts, flights, EARTH_R * 1.004, true); G.flights.n = list.length; G.flights.err = ''; }
    else { G.flights.n = -1; G.flights.err = errLabel(err); }
  }
  async function loadMil(){
    let d = null, err = null;
    G.mil.log = [];
    for (const u of ['https://api.adsb.lol/v2/mil', 'https://api.adsb.one/v2/mil', 'https://opendata.adsb.fi/api/v2/mil', 'https://api.airplanes.live/v2/mil']){
      const host = u.split('/')[2]; try { d = await jget(u); if (d && d.ac){ G.mil.log.push([host, 'ok']); break; } G.mil.log.push([host, 'empty']); } catch (e) { err = e; G.mil.log.push([host, errFull(e)]); }
    }
    if (d && d.ac){ mil = d.ac.filter(a => a.lat != null && a.lon != null).map(a => mapAc(a, 'mil')); setPts(milPts, mil, EARTH_R * 1.005); G.mil.n = mil.length; G.mil.err = ''; }
    else { G.mil.n = -1; G.mil.err = errLabel(err); }
  }
  const EVT_COL = { wildfires: 0xff8a1f, severeStorms: 0xb06bff, volcanoes: 0xff2d95, floods: 0x2dd4bf, seaLakeIce: 0xdff6ff, dustHaze: 0xc9a66b };
  async function loadEvents(){
    try {
      const d = await jget('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&days=30&limit=250');
      events = [];
      for (const e of d.events){
        const g = e.geometry[e.geometry.length - 1], c = e.categories[0] || {};
        if (!g || g.type !== 'Point') continue;
        events.push({ kind: 'event', lon: g.coordinates[0], lat: g.coordinates[1], title: e.title, cat: c.title || 'Event', col: EVT_COL[c.id] || 0xf0e68c, time: Date.parse(g.date) });
      }
      setPts(evtPts, events, EARTH_R * 1.004, true); G.events.n = events.length; G.events.err = '';
    } catch (e) { G.events.n = -1; G.events.err = errLabel(e); }
  }
  let gTimers = [];
  function godPolling(on){
    gTimers.forEach(clearInterval); gTimers = [];
    if (!on){ gCard.classList.remove('show'); return; }
    loadFlights(); loadMil(); loadEvents();
    gTimers = [setInterval(loadFlights, 180000), setInterval(loadMil, 30000), setInterval(loadEvents, 600000)];
  }
  function applyLayers(){
    fltPts.visible = godOn && G.flights.on; milPts.visible = godOn && G.mil.on;
    evtPts.visible = godOn && G.events.on; satGroup.visible = godOn && G.sats.on;
  }
  function renderPanel(){
    gPanel.innerHTML = Object.keys(G).map(k => { const l = G[k];
      return '<div class="gp-row' + (l.on ? ' on' : '') + '" data-k="' + k + '"><i class="gp-sw" style="background:' + l.sw + '"></i><span class="gp-tag">' + l.tag + '</span><span class="gp-name">' + l.name + '</span><span class="gp-n">' + (l.n < 0 ? (l.err || 'offline') : l.n ? l.n.toLocaleString() : '…') + '</span></div>'; }).join('');
  }
  function godTick(){
    G.quakes.n = quakes.length; G.quakes.on = quakesOn; G.sats.n = sats.length;
    const sig = Object.keys(G).map(k => G[k].n + ':' + G[k].on + G[k].err).join('|');
    if (sig !== lastSig){ lastSig = sig; renderPanel(); }
  }
  gPanel.addEventListener('click', (e) => {
    const row = e.target.closest('.gp-row'); if (!row) return;
    const k = row.dataset.k;
    if (G[k].n < 0 && G[k].log){ card = { tag: 'DIAGNOSTIC', title: G[k].name + ' feed', col: '#ff6b6b', rows: G[k].log }; paint(); return; } // tap an offline row to see why
    if (k === 'quakes'){ document.querySelector('.chip[data-toggle="quakes"]').click(); G.quakes.on = quakesOn; }
    else G[k].on = !G[k].on;
    applyLayers(); lastSig = ''; godTick();
  });

  // ---- Info card: what you tap is described, then enriched from free public APIs ----
  let card = null, cardTok = 0;
  function paint(){
    gCard.style.borderColor = card.col;
    gCard.innerHTML = '<div class="gc-tag" style="color:' + card.col + '">' + esc(card.tag) + '</div><div class="gc-title">' + esc(card.title) + '</div>' +
      card.rows.filter(r => r[1] != null && r[1] !== '').map(r => '<div><span>' + r[0] + '</span>' + esc(r[1]) + '</div>').join('');
    gCard.classList.add('show');
  }
  const addRow = (l, v) => { if (v && !card.rows.some(r => r[0] === l && r[1])) card.rows.push([l, v]); };
  gCard.addEventListener('click', () => gCard.classList.remove('show'));
  const fmtLL = (lat, lon) => Math.abs(lat).toFixed(2) + '°' + (lat >= 0 ? 'N' : 'S') + ' ' + Math.abs(lon).toFixed(2) + '°' + (lon >= 0 ? 'E' : 'W');
  const kmh = v => v != null ? Math.round(v * 3.6) + ' km/h' : null;

  function locCard(lat, lon){
    const tok = ++cardTok, sp = getSubsolarPoint(new Date()), R = Math.PI / 180;
    const el = Math.asin(Math.sin(lat * R) * Math.sin(sp.lat * R) + Math.cos(lat * R) * Math.cos(sp.lat * R) * Math.cos((lon - sp.lon) * R)) / R;
    card = { tag: 'LOCATION', title: fmtLL(lat, lon), col: '#d4af6a', rows: [
      ['Solar time', new Date(Date.now() + lon / 15 * 3600000).toISOString().slice(11, 16)],
      ['Sun', el > 0 ? 'Day · ' + Math.round(el) + '° up' : 'Night · ' + Math.round(-el) + '° below'] ] };
    paint();
    jj('https://nominatim.openstreetmap.org/reverse?format=json&zoom=6&accept-language=en&lat=' + lat + '&lon=' + lon).then(async r => {
      if (tok !== cardTok) return;
      if (!r || r.error || !r.address){ card.title = 'Open ocean'; card.rows.unshift(['Area', 'No land or named place here']); paint(); return; }
      const a = r.address;
      card.title = [a.state || a.region || a.county, a.country].filter(Boolean).join(', ') || fmtLL(lat, lon);
      card.rows.unshift(['Place', r.display_name.split(',').slice(0, 3).join(',')]); paint();
      const cc = (a.country_code || '').toUpperCase(); if (!cc) return;
      let c = await jj('https://restcountries.com/v3.1/alpha/' + cc + '?fields=name,capital,population,region,currencies,languages');
      if (tok !== cardTok || !c) return; c = Array.isArray(c) ? c[0] : c;
      addRow('Country', c.name && c.name.common); addRow('Capital', (c.capital || []).join(', '));
      addRow('Population', c.population && c.population.toLocaleString()); addRow('Region', c.region);
      addRow('Currency', Object.values(c.currencies || {}).map(x => x.name).join(', '));
      addRow('Languages', Object.values(c.languages || {}).slice(0, 4).join(', ')); paint();
    });
  }

  function entCard(e){
    const tok = ++cardTok, col = e.kind === 'quake' ? quakeCss(e.depth) : e.kind === 'sat' ? '#7fe3ff' : hexCss(e.col);
    if (e.kind === 'flight' || e.kind === 'mil'){
      card = { tag: e.kind === 'mil' ? 'MILITARY·ADSB' : 'FLIGHT·LIVE', title: e.call, col, rows: [
        ['Aircraft', e.type], ['Registration', e.reg], ['Operator', e.owner], ['Country', e.country],
        ['Altitude', e.alt != null ? Math.round(e.alt).toLocaleString() + ' m (' + Math.round(e.alt * 3.281).toLocaleString() + ' ft)' : null],
        ['Speed', kmh(e.spd)], ['Heading', e.hdg != null ? Math.round(e.hdg) + '°' : null],
        ['Climb', e.vrate != null ? (e.vrate > 0 ? '+' : '') + e.vrate.toFixed(1) + ' m/s' : null], ['Squawk', e.squawk], ['Position', fmtLL(e.lat, e.lon)] ] };
      paint();
      const ap = x => x ? [x.municipality, x.name].filter(Boolean).join(' · ') : null;
      jj('https://api.adsbdb.com/v0/callsign/' + encodeURIComponent(e.call)).then(r => { const f = r && r.response && r.response.flightroute; if (tok !== cardTok || !f) return;
        addRow('Airline', f.airline && f.airline.name); addRow('From', ap(f.origin)); addRow('To', ap(f.destination)); paint(); });
      if (e.hex) jj('https://api.adsbdb.com/v0/aircraft/' + e.hex).then(r => { const a = r && r.response && r.response.aircraft; if (tok !== cardTok || !a) return;
        addRow('Aircraft', [a.manufacturer, a.type].filter(Boolean).join(' ')); addRow('Registration', a.registration); addRow('Operator', a.registered_owner); paint(); });
    } else if (e.kind === 'event'){
      card = { tag: 'EVENT·NASA EONET', title: e.title, col, rows: [['Category', e.cat], ['Updated', timeAgo(e.time)], ['Position', fmtLL(e.lat, e.lon)]] }; paint();
    } else if (e.kind === 'quake'){
      card = { tag: 'EARTHQUAKE·USGS', title: 'M' + e.mag.toFixed(1), col, rows: [['Where', e.place], ['Depth', Math.round(e.depth) + ' km · ' + (e.depth < 70 ? 'shallow' : e.depth < 300 ? 'intermediate' : 'deep')], ['When', timeAgo(e.time)], ['Position', fmtLL(e.lat, e.lon)]] }; paint();
    } else {
      const a = 6371 + e.alt;
      card = { tag: 'SATELLITE·LIVE', title: e.name, col, rows: [['Altitude', Math.round(e.alt).toLocaleString() + ' km'], ['Speed', Math.sqrt(398600.44 / a).toFixed(2) + ' km/s'], ['Orbit', (2 * Math.PI * Math.sqrt(a * a * a / 398600.44) / 60).toFixed(0) + ' min per lap'], ['Over', fmtLL(e.lat, e.lon)]] }; paint();
    }
  }

  function pickEntity(lat, lon, tol){
    const satList = godOn && G.sats.on ? sats.filter(x => x.lat != null).map(x => ({ kind: 'sat', name: x.name, lat: x.lat, lon: x.lon, alt: x.alt })) : [];
    const lists = [godOn && G.flights.on && flights, godOn && G.mil.on && mil, godOn && G.events.on && events, quakesOn && quakes.map(q => Object.assign({ kind: 'quake' }, q)), satList];
    let best = null, bd = tol;
    for (const arr of lists){
      if (!arr) continue;
      for (const e of arr){
        let dl = Math.abs(e.lon - lon); if (dl > 180) dl = 360 - dl;
        const d = Math.hypot(e.lat - lat, dl * Math.cos(lat * Math.PI / 180)) * (e.kind === 'flight' ? 1 : 0.6);
        if (d < bd){ bd = d; best = e; }
      }
    }
    best ? entCard(best) : locCard(lat, lon);
  }

  function setGodEye(on){
    godOn = on;
    satGroup.visible = on;
    if (on) loadSats();
    godPolling(on); applyLayers();
    cityMesh.visible = on;
    camGoal = on ? GOD_DIST : HOME_DIST;
    if (on){
      sun.intensity = 1.3;
      ambientLight.intensity = 0.16;
      ambientLight.color.set(0x1a2440);
      nightMat.opacity = 0;
      lastHud = 0;
    } else {
      applyDayNightMode();
    }
  }

  function updateGodEye(now){
    if (camGoal !== null){
      const len = camera.position.length();
      if (Math.abs(len - camGoal) < 0.02) camGoal = null;
      else camera.position.setLength(len + (camGoal - len) * 0.06);
    }
    if (!godOn) return;
    cityMat.uniforms.sunDir.value.copy(sun.position).normalize();
    updateSats(now);
    if (now - lastHud < 500) return;
    lastHud = now; godTick();
    const d = new Date();
    const sp = getSubsolarPoint(d);
    godUtc.textContent = d.toISOString().slice(11, 19);
    godSun.textContent = Math.abs(sp.lat).toFixed(1) + '°' + (sp.lat >= 0 ? 'N' : 'S') + ' ' + Math.abs(sp.lon).toFixed(1) + '°' + (sp.lon >= 0 ? 'E' : 'W');
    if (!quakes.length){ godQuakes.textContent = 'no earthquake data yet'; return; }
    const top = quakes.reduce((a, b) => (b.mag > a.mag ? b : a));
    godQuakes.textContent = quakes.length + ' quakes / 24h · strongest M' + top.mag.toFixed(1) + ' ' + top.place;
  }

  // ---- Mode switch: Globe (home) <-> flat Map <-> God's Eye ----
  const brandSub = document.getElementById('brand-sub');
  function setMode(mode){
    currentMode = mode;
    document.querySelectorAll('.mode-switch button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    const spinChip = document.querySelector('.chip[data-toggle="spin"]');
    const compassBtn = document.getElementById('compass');
    document.body.classList.toggle('god', mode === 'god');
    setGodEye(mode === 'god');
    if (mode === 'globe' || mode === 'god'){
      wrap.style.display = '';
      mapWrapEl.classList.remove('active');
      if (compassBtn) compassBtn.style.display = '';
      if (spinChip) spinChip.style.display = '';
      brandSub.textContent = mode === 'god' ? 'live planet · tap a dot' : 'drag to rotate · pinch to zoom · tap to mark';
      controls.autoRotate = autoRotate && !flying;
    } else {
      wrap.style.display = 'none';
      mapWrapEl.classList.add('active');
      if (compassBtn) compassBtn.style.display = 'none';
      if (spinChip) spinChip.style.display = 'none';
      brandSub.textContent = 'drag to pan · scroll to zoom · tap to mark';
      resizeMapCanvas();
      drawMap();
    }
  }
  document.querySelectorAll('.mode-switch button').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });
  resizeMapCanvas();


  // ---- Search / geocoding ----
  const searchInput = document.getElementById('search-input');
  const searchStatus = document.getElementById('search-status');

  async function geocode(query){
    searchStatus.className = 'search-status';
    searchStatus.textContent = 'searching…';
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const results = await res.json();
      if (!results.length) {
        searchStatus.textContent = 'no place found — try a different spelling';
        searchStatus.classList.add('err');
        return;
      }
      const { lat, lon, display_name } = results[0];
      const latNum = parseFloat(lat), lonNum = parseFloat(lon);
      const latDir = latNum >= 0 ? 'N' : 'S';
      const lonDir = lonNum >= 0 ? 'E' : 'W';
      const coordStr = `${Math.abs(latNum).toFixed(2)}°${latDir}, ${Math.abs(lonNum).toFixed(2)}°${lonDir}`;
      searchStatus.textContent = display_name.split(',').slice(0,2).join(',') + ' · ' + coordStr;
      goToPlace(parseFloat(lat), parseFloat(lon));
    } catch (e) {
      searchStatus.textContent = 'search unavailable right now — try again shortly';
      searchStatus.classList.add('err');
    }
  }

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && searchInput.value.trim()) {
      geocode(searchInput.value.trim());
    }
  });

  // ---- Layer toggle chips ----
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.dataset.toggle;
      const active = chip.classList.toggle('active');
      if (key === 'clouds') {
        cloudMesh.visible = active;
        if (currentMode === 'map') drawMap();
      } else if (key === 'night') {
        nightMode = active;
        applyDayNightMode();
        if (currentMode === 'map') drawMap();
      } else if (key === 'quakes') {
        quakesOn = active;
        quakeGroup.visible = active;
        if (active) loadQuakes();
        if (currentMode === 'map') drawMap();
      } else if (key === 'spin') {
        autoRotate = active;
        if (!flying) controls.autoRotate = active;
      }
    });
  });

  // ---- God's Eye layer: live earthquakes (USGS, last 24h, M2.5+) ----
  const QUAKE_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson';
  const quakeGroup = new THREE.Group();
  globeGroup.add(quakeGroup);
  const quakeGeo = new THREE.SphereGeometry(1, 10, 10);
  let quakes = [];
  let quakesOn = true;
  let quakeTimer = null;

  // shallow = gold, medium = orange, deep = red
  function quakeCss(depth){ return depth < 70 ? '#ffe14d' : depth < 300 ? '#ff9500' : '#ff6b6b'; }
  function quakeHex(depth){ return depth < 70 ? 0xffe14d : depth < 300 ? 0xff9500 : 0xff6b6b; }

  function timeAgo(ms){
    const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' d ago';
  }

  function buildQuakeMeshes(){
    while (quakeGroup.children.length){
      const m = quakeGroup.children[0];
      quakeGroup.remove(m);
      m.material.dispose();
    }
    for (const q of quakes){
      const mat = new THREE.MeshBasicMaterial({ color: quakeHex(q.depth), transparent: true, opacity: 0.9 });
      const mesh = new THREE.Mesh(quakeGeo, mat);
      const r = 0.006 + q.mag * 0.0035;
      mesh.scale.setScalar(r);
      mesh.position.copy(latLonToVec3(q.lat, q.lon, EARTH_R * 1.006));
      mesh.userData = { base: r, recent: (Date.now() - q.time) < 3600000, phase: Math.random() * 6.28 };
      quakeGroup.add(mesh);
    }
    quakeGroup.visible = quakesOn;
  }

  async function loadQuakes(){
    try {
      const res = await fetch(QUAKE_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      quakes = data.features
        .filter(f => f.properties.mag != null && f.geometry)
        .map(f => ({
          lon: f.geometry.coordinates[0],
          lat: f.geometry.coordinates[1],
          depth: f.geometry.coordinates[2] || 0,
          mag: f.properties.mag,
          place: f.properties.place || 'Unknown location',
          time: f.properties.time
        }));
      buildQuakeMeshes();
      searchStatus.className = 'search-status';
      searchStatus.textContent = quakes.length + ' earthquakes in the last 24h · tap one for details';
      if (currentMode === 'map') drawMap();
    } catch (e) {
      searchStatus.className = 'search-status err';
      searchStatus.textContent = 'earthquake data unavailable right now';
    }
  }

  function showQuakeAt(lat, lon, maxDeg){
    if (!quakesOn || !quakes.length) return;
    let best = null, bestD = maxDeg;
    for (const q of quakes){
      let dLon = Math.abs(q.lon - lon); if (dLon > 180) dLon = 360 - dLon;
      const d = Math.hypot(q.lat - lat, dLon * Math.cos(lat * Math.PI / 180));
      if (d < bestD){ best = q; bestD = d; }
    }
    if (best){
      searchStatus.className = 'search-status';
      searchStatus.textContent = 'M' + best.mag.toFixed(1) + ' · ' + best.place + ' · ' + Math.round(best.depth) + ' km deep · ' + timeAgo(best.time);
    }
  }

  function pulseQuakes(t){
    if (!quakesOn) return;
    for (const m of quakeGroup.children){
      if (m.userData.recent) m.scale.setScalar(m.userData.base * (1 + 0.3 * Math.sin(t * 0.004 + m.userData.phase)));
    }
  }

  loadQuakes();
  quakeTimer = setInterval(() => { if (quakesOn) loadQuakes(); }, 5 * 60 * 1000);

  // ---- Resize ----
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    resizeMapCanvas();
    if (currentMode === 'map') drawMap();
  });

  // ---- Compass ----
  const compassNeedle = document.getElementById('compass-needle');
  const compassEl = document.getElementById('compass');
  const _tmpNorth = new THREE.Vector3();
  const _tmpOrigin = new THREE.Vector3();

  function updateCompass(){
    _tmpOrigin.set(0, 0, 0).applyMatrix4(globeGroup.matrixWorld).project(camera);
    _tmpNorth.set(0, EARTH_R * 1.4, 0).applyMatrix4(globeGroup.matrixWorld).project(camera);
    const dx = _tmpNorth.x - _tmpOrigin.x;
    const dy = _tmpNorth.y - _tmpOrigin.y; // NDC y is up already
    const angleDeg = Math.atan2(dx, dy) * (180 / Math.PI);
    compassNeedle.style.transform = `rotate(${angleDeg}deg)`;
  }

  function resetNorth(){
    const startQuat = globeGroup.quaternion.clone();
    const endQuat = new THREE.Quaternion();
    const startTime = performance.now();
    const duration = 700;
    controls.autoRotate = false;
    function step(now){
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      globeGroup.quaternion.slerpQuaternions(startQuat, endQuat, eased);
      if (t < 1) requestAnimationFrame(step);
      else controls.autoRotate = autoRotate;
    }
    requestAnimationFrame(step);
  }
  compassEl.addEventListener('click', resetNorth);

  // ---- Day / Night mode: whole-globe toggle, not a partial terminator ----
  let nightMode = false;
  function applyDayNightMode(){
    if (nightMode) {
      sun.intensity = 0;
      ambientLight.intensity = 0.12;
      ambientLight.color.set(0x1a2440);
      nightMat.opacity = 1;
    } else {
      sun.intensity = 1.05;
      ambientLight.intensity = 0.8;
      ambientLight.color.set(0xffffff);
      nightMat.opacity = 0;
    }
  }
  applyDayNightMode();

  // ---- Render loop ----
  function updateSun(){
    const { lat, lon } = getSubsolarPoint(new Date());
    sun.position.copy(latLonToVec3(lat, lon, 6));
  }

  function animate(){
    requestAnimationFrame(animate);
    cloudMesh.rotation.y += 0.00025;
    pulseQuakes(performance.now());
    updateGodEye(performance.now());
    controls.update();
    updateSun();
    renderer.render(scene, camera);
    updateCompass();
  }
  animate();

  // Hide loading screen once the day texture is ready (or after a timeout fallback)
  let revealed = false;
  function reveal(){
    if (revealed) return;
    revealed = true;
    if (usedFallbackMap) {
      const p = document.querySelector('.loading p');
      if (p) p.textContent = 'using offline fallback map';
    }
    loading.classList.add('hide');
    setTimeout(() => loading.style.display = 'none', 650);
  }
  const check = setInterval(() => {
    if (dayLoaded) { reveal(); clearInterval(check); }
  }, 150);
  setTimeout(reveal, 6000); // fallback so the app never hangs indefinitely

  // ---- PWA: register service worker for installability + offline shell ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
